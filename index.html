<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pokémon Champions | Ultimate Stadium Battle</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050508">

    <!-- Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --vfx-color: #6366f1;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #030308;
            color: #f8fafc;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        .pixel-art {
            image-rendering: pixelated;
        }

        /* 3D STADIUM PERSPECTIVE CAMERA */
        .stadium-stage {
            perspective: 1100px;
            background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.25) 0%, #030308 80%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
        }

        .cam-zoom-player { transform: scale(1.15) translateY(30px) rotateX(10deg); }
        .cam-zoom-enemy { transform: scale(1.15) translateY(-30px) rotateX(-5deg); }

        .battle-pitch {
            transform: rotateX(56deg) translateZ(-40px);
            background: radial-gradient(ellipse at center, #0f172a 15%, #020617 85%);
            border: 4px solid rgba(99, 102, 241, 0.35);
            box-shadow: 0 0 100px rgba(99, 102, 241, 0.3), inset 0 0 80px rgba(0, 0, 0, 0.9);
            transition: all 0.4s ease;
        }

        /* ENVIRONMENT FLOORS */
        .floor-rock { background: radial-gradient(circle, #78716c 20%, #292524 80%); border-color: #a8a29e; }
        .floor-water { background: radial-gradient(circle, #0284c7 20%, #082f49 80%); border-color: #38bdf8; }
        .floor-electric { background: radial-gradient(circle, #eab308 20%, #422006 80%); border-color: #facc15; }
        .floor-grass { background: radial-gradient(circle, #16a34a 20%, #052e16 80%); border-color: #4ade80; }
        .floor-fire { background: radial-gradient(circle, #dc2626 20%, #450a0a 80%); border-color: #f87171; }
        .floor-psychic { background: radial-gradient(circle, #9333ea 20%, #3b0764 80%); border-color: #c084fc; }
        .floor-dragon { background: radial-gradient(circle, #4f46e5 20%, #1e1b4b 80%); border-color: #818cf8; }

        /* SPRITE ANIMATIONS */
        .pokemon-sprite {
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.8));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        @keyframes sprite-idle {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        .anim-idle { animation: sprite-idle 2.5s ease-in-out infinite; }

        @keyframes lunge-right {
            0% { transform: translateX(0) scale(1); }
            50% { transform: translateX(70px) scale(1.2) rotate(5deg); }
            100% { transform: translateX(0) scale(1); }
        }
        .anim-lunge-player { animation: lunge-right 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes lunge-left {
            0% { transform: translateX(0) scale(1); }
            50% { transform: translateX(-70px) scale(1.2) rotate(-5deg); }
            100% { transform: translateX(0) scale(1); }
        }
        .anim-lunge-enemy { animation: lunge-left 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes screen-shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-15px, 12px) rotate(-1deg); }
            40% { transform: translate(15px, -12px) rotate(1deg); }
            60% { transform: translate(-8px, 6px); }
            80% { transform: translate(8px, -6px); }
        }
        .shake-hard { animation: screen-shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

        @keyframes damage-flash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(5) contrast(200%) drop-shadow(0 0 30px #ef4444); }
        }
        .flash-fx { animation: damage-flash 0.3s ease-out; }

        /* VFX SHOCKWAVES & SLASHES */
        @keyframes shockwave-grow {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 20px; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; border-width: 0px; }
        }
        .vfx-shockwave {
            position: absolute; width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid white; background: radial-gradient(circle, var(--vfx-color) 0%, transparent 80%);
            animation: shockwave-grow 0.4s ease-out forwards; z-index: 60; mix-blend-mode: screen;
        }

        @keyframes slash-strike {
            0% { width: 0; opacity: 1; transform: translate(-50%, -50%) rotate(-35deg) scaleX(1); }
            50% { width: 140%; opacity: 1; }
            100% { width: 140%; opacity: 0; transform: translate(-50%, -50%) rotate(-35deg) scaleX(0); }
        }
        .vfx-slash {
            position: absolute; height: 10px; background: #ffffff;
            box-shadow: 0 0 20px #ffffff, 0 0 40px var(--vfx-color);
            z-index: 65; animation: slash-strike 0.35s ease-out forwards; border-radius: 6px;
        }

        /* EVOLUTION & CATCH CINEMATICS */
        @keyframes throw-arc {
            0% { left: 20%; bottom: 25%; transform: scale(0.6) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(360deg) translateY(-140px); }
            100% { left: 75%; bottom: 65%; transform: scale(0.7) rotate(720deg); opacity: 1; }
        }
        .anim-throw { animation: throw-arc 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        @keyframes ball-shake {
            0%, 100% { transform: rotate(0deg) scale(0.7); }
            25% { transform: rotate(-25deg) scale(0.7); }
            75% { transform: rotate(25deg) scale(0.7); }
        }
        .anim-wiggle { animation: ball-shake 0.45s ease-in-out; }

        @keyframes evo-glow-burst {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 10px white); }
            50% { filter: brightness(10) drop-shadow(0 0 60px #818cf8); transform: scale(1.15); }
        }
        .anim-evo { animation: evo-glow-burst 0.6s infinite; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.09);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>

        // GYM LEAGUES & ARENA STAGES[cite: 4]
        const GYMS = [
            { id: "pewter", name: "Pewter Gym", leader: "Brock", type: "Rock", floor: "floor-rock", boss: "Onix", lvl: 25 },
            { id: "cerulean", name: "Cerulean Gym", leader: "Misty", type: "Water", floor: "floor-water", boss: "Blastoise", lvl: 35 },
            { id: "vermilion", name: "Vermilion Gym", leader: "Lt. Surge", type: "Electric", floor: "floor-electric", boss: "Raichu", lvl: 45 },
            { id: "celadon", name: "Celadon Gym", leader: "Erika", type: "Grass", floor: "floor-grass", boss: "Venusaur", lvl: 55 },
            { id: "fuchsia", name: "Fuchsia Gym", leader: "Koga", type: "Poison", floor: "floor-rock", boss: "Gengar", lvl: 65 },
            { id: "saffron", name: "Saffron Gym", leader: "Sabrina", type: "Psychic", floor: "floor-psychic", boss: "Alakazam", lvl: 75 },
            { id: "cinnabar", name: "Cinnabar Gym", leader: "Blaine", type: "Fire", floor: "floor-fire", boss: "Charizard", lvl: 85 },
            { id: "viridian", name: "Viridian Gym", leader: "Giovanni", type: "Ground", floor: "floor-rock", boss: "Garchomp", lvl: 90 },
            { id: "champion", name: "Pokémon League", leader: "Lance", type: "Dragon", floor: "floor-dragon", boss: "Rayquaza", lvl: 100 }
        ];

        // GAME STATE[cite: 4]
        function createCombatant(name, lvl, isBoss = false) {
            const template = POKEDEX[name] || POKEDEX.Pikachu;
            const hpStat = Math.floor((template.hp * 2 * lvl) / 100 + lvl + 10) * (isBoss ? 1.3 : 1);
            return {
                ...template,
                lvl: lvl,
                maxHp: hpStat,
                currentHp: hpStat,
                exp: 0,
                nextExp: Math.pow(lvl + 1, 3)
            };
        }

        const party = [
            createCombatant("Blastoise", 85),
            createCombatant("Lucario", 82),
            createCombatant("Garchomp", 84),
            createCombatant("Meowscarada", 83)
        ];

        const battle = {
            player: party[0],
            enemy: createCombatant("Charizard", 85, true),
            isTurnLocked: false
        };

        // CHIPTUNE SOUND GENERATOR[cite: 3]
        let audioActive = false;
        let synth, noise;

        function toggleAudio() {
            if (!synth) {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                noise = new Tone.NoiseSynth().toDestination();
            }
            Tone.start();
            audioActive = !audioActive;
            document.getElementById('audio-text').innerText = audioActive ? "Audio: ON" : "Audio: OFF";
            document.getElementById('audio-icon').className = audioActive ? "fa-solid fa-volume-high text-emerald-400" : "fa-solid fa-volume-xmark text-rose-400";
            if (audioActive) synth.triggerAttackRelease(['C4', 'E4', 'G4'], '8n');
        }

        function playSfx(type) {
            if (!audioActive) return;
            try {
                if (type === 'hit') noise.triggerAttackRelease('16n');
                else if (type === 'super') synth.triggerAttackRelease(['G4', 'C5', 'E5'], '8n');
                else if (type === 'faint') synth.triggerAttackRelease(['G3', 'Eb3', 'C3'], '4n');
            } catch(e) {}
        }

        // BATTLE VIEWPORT BINDINGS[cite: 4]
        function initBattleView() {
            document.getElementById('player-name').innerText = battle.player.name;
            document.getElementById('player-lvl').innerText = `Lv.${battle.player.lvl}`;
            document.getElementById('player-sprite').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/back/${battle.player.id}.gif`;
            
            const pTypes = document.getElementById('player-types-container');
            pTypes.innerHTML = "";
            battle.player.type.forEach(t => {
                pTypes.innerHTML += `<span class="px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[8px]">${t.toUpperCase()}</span>`;
            });

            document.getElementById('enemy-name').innerText = battle.enemy.name;
            document.getElementById('enemy-lvl').innerText = `Lv.${battle.enemy.lvl}`;
            document.getElementById('enemy-sprite').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${battle.enemy.id}.gif`;

            const eTypes = document.getElementById('enemy-types-container');
            eTypes.innerHTML = "";
            battle.enemy.type.forEach(t => {
                eTypes.innerHTML += `<span class="px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 text-[8px]">${t.toUpperCase()}</span>`;
            });

            renderMoves();
            updateHpDisplay();
        }

        function renderMoves() {
            const grid = document.getElementById('moves-grid');
            grid.innerHTML = "";
            battle.player.moves.forEach(mName => {
                const m = MOVES[mName] || { name: mName, type: "Normal", power: 60, color: "#94a3b8" };
                const btn = document.createElement('button');
                btn.className = "p-2.5 rounded-xl glass-panel flex flex-col text-left hover:border-indigo-500/50 active:scale-95 transition";
                btn.onclick = () => executeTurn(m);
                btn.innerHTML = `
                    <span class="text-[9px] font-bold text-white">${m.name}</span>
                    <span class="text-[7.5px] font-mono mt-0.5" style="color:${m.color || '#818cf8'}">${m.type} • PWR ${m.power}</span>
                `;
                grid.appendChild(btn);
            });
        }

        function updateHpDisplay() {
            const pPct = Math.max(0, (battle.player.currentHp / battle.player.maxHp) * 100);
            const ePct = Math.max(0, (battle.enemy.currentHp / battle.enemy.maxHp) * 100);

            const pBar = document.getElementById('player-hp-bar');
            pBar.style.width = `${pPct}%`;
            pBar.className = `h-full rounded-full transition-all duration-500 ${pPct > 50 ? 'bg-emerald-400' : pPct > 20 ? 'bg-amber-400' : 'bg-rose-500'}`;
            document.getElementById('player-hp-text').innerText = `${Math.round(battle.player.currentHp)} / ${battle.player.maxHp}`;

            const eBar = document.getElementById('enemy-hp-bar');
            eBar.style.width = `${ePct}%`;
            eBar.className = `h-full rounded-full transition-all duration-500 ${ePct > 50 ? 'bg-emerald-400' : ePct > 20 ? 'bg-amber-400' : 'bg-rose-500'}`;
            document.getElementById('enemy-hp-text').innerText = `${Math.round(ePct)}%`;
        }

        // CINEMATIC ATTACK CHOREOGRAPHY[cite: 4, 6]
        async function executeTurn(move) {
            if (battle.isTurnLocked || battle.player.currentHp <= 0 || battle.enemy.currentHp <= 0) return;
            battle.isTurnLocked = true;

            const arena = document.getElementById('battle-arena');
            const pSprite = document.getElementById('player-sprite');
            const eSprite = document.getElementById('enemy-sprite');
            const log = document.getElementById('battle-log');

            // 1. Zoom Camera on Player & Strike[cite: 6]
            arena.classList.add('cam-zoom-player');
            pSprite.classList.add('anim-lunge-player');
            log.innerText = `${battle.player.name} used ${move.name}!`;
            playSfx('hit');

            setTimeout(() => {
                pSprite.classList.remove('anim-lunge-player');
                arena.classList.remove('cam-zoom-player');

                // 2. Damage & Type Multiplier Calculation[cite: 4]
                let mult = 1.0;
                battle.enemy.type.forEach(t => {
                    if (TYPE_CHART[move.type] && TYPE_CHART[move.type][t] !== undefined) {
                        mult *= TYPE_CHART[move.type][t];
                    }
                });

                const dmg = Math.round((move.power * 0.75 + Math.random() * 8) * mult);
                battle.enemy.currentHp = Math.max(0, battle.enemy.currentHp - dmg);
                updateHpDisplay();

                eSprite.classList.add('flash-fx');
                arena.classList.add('shake-hard');
                if (mult > 1.0) playSfx('super'); else playSfx('hit');

                setTimeout(() => {
                    eSprite.classList.remove('flash-fx');
                    arena.classList.remove('shake-hard');

                    if (mult > 1.0) log.innerText = "It's super effective! 💥";
                    else if (mult < 1.0 && mult > 0) log.innerText = "It's not very effective...";

                    if (battle.enemy.currentHp <= 0) {
                        log.innerText = `Enemy ${battle.enemy.name} fainted! Stadium Victory! 🏆`;
                        playSfx('faint');
                        eSprite.style.opacity = '0';
                        return;
                    }

                    // 3. Enemy Counter-Attack[cite: 4]
                    setTimeout(enemyTurn, 1000);
                }, 400);
            }, 350);
        }

        function enemyTurn() {
            const arena = document.getElementById('battle-arena');
            const pSprite = document.getElementById('player-sprite');
            const eSprite = document.getElementById('enemy-sprite');
            const log = document.getElementById('battle-log');

            const mName = battle.enemy.moves[Math.floor(Math.random() * battle.enemy.moves.length)];
            const move = MOVES[mName] || { name: mName, type: battle.enemy.type[0], power: 75 };

            arena.classList.add('cam-zoom-enemy');
            eSprite.classList.add('anim-lunge-enemy');
            log.innerText = `Enemy ${battle.enemy.name} used ${move.name}!`;
            playSfx('hit');

            setTimeout(() => {
                eSprite.classList.remove('anim-lunge-enemy');
                arena.classList.remove('cam-zoom-enemy');

                let mult = 1.0;
                battle.player.type.forEach(t => {
                    if (TYPE_CHART[move.type] && TYPE_CHART[move.type][t] !== undefined) {
                        mult *= TYPE_CHART[move.type][t];
                    }
                });

                const dmg = Math.round((move.power * 0.7 + Math.random() * 8) * mult);
                battle.player.currentHp = Math.max(0, battle.player.currentHp - dmg);
                updateHpDisplay();

                pSprite.classList.add('flash-fx');
                arena.classList.add('shake-hard');

                setTimeout(() => {
                    pSprite.classList.remove('flash-fx');
                    arena.classList.remove('shake-hard');

                    if (battle.player.currentHp <= 0) {
                        log.innerText = `${battle.player.name} fainted! You lost the championship.`;
                        playSfx('faint');
                        pSprite.style.opacity = '0';
                        return;
                    }

                    battle.isTurnLocked = false;
                    log.innerText = `What will ${battle.player.name} do?`;
                }, 400);
            }, 350);
        }

        // MODAL MANAGEMENT[cite: 4]
        function openModal(id) {
            if (id === 'gym-modal') renderGymList();
            if (id === 'party-modal') renderPartyList();
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function renderGymList() {
            const list = document.getElementById('gym-list');
            list.innerHTML = "";
            GYMS.forEach((gym, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-3 rounded-2xl glass-panel flex items-center justify-between text-left hover:border-indigo-500 active:scale-95 transition";
                btn.onclick = () => selectGym(idx);
                btn.innerHTML = `
                    <div>
                        <span class="text-[10px] text-white font-bold block">${gym.name}</span>
                        <span class="text-[8px] text-gray-400 font-sans">Leader ${gym.leader} • ${gym.boss} (Lv.${gym.lvl})</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-indigo-400 text-xs"></i>
                `;
                list.appendChild(btn);
            });
        }

        function selectGym(idx) {
            const g = GYMS[idx];
            battle.enemy = createCombatant(g.boss, g.lvl, true);
            document.getElementById('league-title').innerText = `${g.name} Arena`;
            document.getElementById('enemy-sprite').style.opacity = '1';
            
            // Swap Floor Arena Styling[cite: 6]
            const pitch = document.getElementById('pitch-platform');
            pitch.className = `absolute inset-x-6 top-1/3 bottom-20 battle-pitch rounded-[44px] -z-10 flex items-center justify-center ${g.floor}`;

            initBattleView();
            closeModal('gym-modal');
        }

        function renderPartyList() {
            const list = document.getElementById('party-list');
            list.innerHTML = "";
            party.forEach((p, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full p-3 rounded-2xl glass-panel flex items-center justify-between text-left hover:border-purple-500 active:scale-95 transition ${battle.player === p ? 'border-purple-500/50 bg-purple-950/20' : ''}`;
                btn.onclick = () => switchActiveMon(idx);
                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" class="w-10 h-10 pixel-art">
                        <div>
                            <span class="text-[10px] text-white font-bold block">${p.name} (Lv.${p.lvl})</span>
                            <span class="text-[8px] text-gray-400 font-sans">HP: ${p.currentHp}/${p.maxHp}</span>
                        </div>
                    </div>
                    <span class="text-[9px] font-mono text-purple-400 font-bold">${battle.player === p ? 'ACTIVE' : 'SELECT'}</span>
                `;
                list.appendChild(btn);
            });
        }

        function switchActiveMon(idx) {
            battle.player = party[idx];
            document.getElementById('player-sprite').style.opacity = '1';
            initBattleView();
            closeModal('party-modal');
        }

        window.addEventListener('DOMContentLoaded', initBattleView);
    </script>
