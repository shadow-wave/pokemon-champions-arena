<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pokémon Ultra FX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Press Start 2P', cursive;
        background-color: #050505;
        color: #f8fafc;
        user-select: none;
        overflow: hidden; 
        touch-action: none;
      }
      .pixel-art { 
        image-rendering: -webkit-optimize-contrast;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
        image-rendering: pixelated; 
      }
      @keyframes sprite-idle {
        0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6)); }
        50% { transform: scale(1.02) translateY(-2%); filter: drop-shadow(0 25px 25px rgba(0,0,0,0.4)); }
      }
      .anim-sprite-idle { animation: sprite-idle 3s ease-in-out infinite; }

      
      /* --- CINEMATICS --- */
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .anim-fade-in { animation: fade-in 1s ease-out forwards; }
      
      @keyframes slide-in-left { from { transform: translateX(-100vw); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      .anim-slide-left { animation: slide-in-left 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      
      @keyframes slide-in-right { from { transform: translateX(100vw); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      .anim-slide-right { animation: slide-in-right 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

      @keyframes vs-crash {
        0% { transform: scale(3); opacity: 0; }
        50% { transform: scale(1); opacity: 1; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      .anim-vs { animation: vs-crash 0.5s cubic-bezier(0.1, 0.7, 1.0, 0.1) forwards; }

      /* --- EVOLUTION --- */
      @keyframes evo-flash {
        0% { filter: brightness(0) invert(1); transform: scale(1); }
        50% { filter: brightness(1) invert(0); transform: scale(1.1); }
        100% { filter: brightness(0) invert(1); transform: scale(1); }
      }
      .anim-evo-flash { animation: evo-flash 0.5s linear infinite; }
      
      @keyframes evo-glow {
        0% { box-shadow: 0 0 10px white; }
        50% { box-shadow: 0 0 50px white, 0 0 100px white; }
        100% { box-shadow: 0 0 10px white; }
      }
      .anim-evo-glow { animation: evo-glow 2s ease-in-out infinite; }

      /* --- STADIUM ENV --- */
      .stadium-lights {
        background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.4) 0%, transparent 60%);
        mix-blend-mode: overlay;
      }
      .stadium-crowd {
        background-image: radial-gradient(circle, #334155 1px, transparent 1px);
        background-size: 4px 4px;
        opacity: 0.3;
        mask-image: linear-gradient(to bottom, transparent, black);
      }
      .battle-platform {
        background: radial-gradient(circle, #10b981 30%, #047857 70%);
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
        border: 4px solid rgba(255,255,255,0.1);
      }
      .stadium-floor { background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.2) 10px, rgba(0,0,0,0.2) 20px); }
      .pool-water { background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2) 10%, transparent 20%); background-size: 20px 20px; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); }
      .grid-floor { background-image: linear-gradient(transparent 90%, rgba(255,255,0,0.2) 90%), linear-gradient(90deg, transparent 90%, rgba(255,255,0,0.2) 90%); background-size: 30px 30px; }
      .toxic-floor { background-image: radial-gradient(circle, rgba(168,85,247,0.2) 20%, transparent 60%); background-size: 40px 40px; box-shadow: inset 0 0 50px rgba(0,0,0,0.6); }
      .magic-floor { background-image: radial-gradient(circle, rgba(236,72,153,0.15) 30%, transparent 70%); background-size: 60px 60px; box-shadow: inset 0 0 30px rgba(0,0,0,0.6); }
      .magma-floor { background-image: radial-gradient(ellipse at 50% 50%, rgba(239,68,68,0.3) 20%, transparent 50%); background-size: 50px 30px; }
      .desert-floor { background-image: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0,0,0,0.1) 20px, rgba(0,0,0,0.1) 40px); }
      
      /* --- SKYBOX & STARS --- */
      @keyframes twinkle {
          0%, 100% { opacity: 0.3; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.2); }
      }
      .star {
          position: absolute;
          background: white;
          border-radius: 50%;
          animation: twinkle ease-in-out infinite;
      }

      /* --- VFX 1: CHARGE UP --- */
      @keyframes charge-gather {
        0% { transform: translate(-50%, -50%) scale(var(--charge-scale-start, 2)); opacity: 0; border-width: 1px; filter: brightness(1) drop-shadow(0 0 5px var(--vfx-color)); }
        50% { opacity: 1; border-width: 4px; filter: brightness(1.5) drop-shadow(0 0 15px var(--vfx-color)); }
        100% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 8px; background: white; filter: brightness(2) drop-shadow(0 0 20px var(--vfx-color)); }
      }
      @keyframes charge-ring-expand {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; border-width: 8px; }
        50% { opacity: var(--charge-ring-opacity, 0.8); border-width: 4px; }
        100% { transform: translate(-50%, -50%) scale(var(--charge-scale-start, 2.5)); opacity: 0; border-width: 1px; }
      }
      .vfx-charge {
        position: absolute;
        width: var(--charge-size, 120px); height: var(--charge-size, 120px);
        border-radius: 50%;
        border: 2px solid var(--vfx-color);
        box-shadow: 0 0 15px var(--vfx-color);
        animation: charge-gather var(--charge-duration, 0.5s) ease-in forwards;
        z-index: 60;
        left: 50%; top: 50%; /* Centered relative to mon */
      }
      .vfx-charge::before {
        content: ''; position: absolute; inset: -20px; border-radius: 50%;
        border: 4px solid var(--vfx-color);
        box-shadow: inset 0 0 10px var(--vfx-color), 0 0 10px var(--vfx-color);
        animation: charge-ring-expand var(--charge-duration, 0.5s) ease-out infinite;
        opacity: 0;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
      }
      .vfx-charge::after {
        content: ''; position: absolute; inset: -10px; border-radius: 50%;
        border: 1px dashed white; animation: spin-slow 2s linear infinite;
        left: 50%; top: 50%; transform: translate(-50%, -50%);
      }

      /* --- VFX 2: PROJECTILES --- */
      @keyframes proj-p2e {
        0% { left: 20%; top: 70%; transform: scale(0.5); opacity: 1; }
        100% { left: 80%; top: 30%; transform: scale(1.2); opacity: 1; }
      }
      .anim-proj-p2e { animation: proj-p2e 0.4s linear forwards; }

      @keyframes proj-e2p {
        0% { left: 80%; top: 30%; transform: scale(0.5); opacity: 1; }
        100% { left: 20%; top: 70%; transform: scale(1.2); opacity: 1; }
      }
      .anim-proj-e2p { animation: proj-e2p 0.4s linear forwards; }

      @keyframes stream-p2e {
        0% { left: 20%; top: 70%; transform: scale(0.2); opacity: 0; }
        10% { opacity: 1; transform: scale(0.6); }
        90% { opacity: 1; transform: scale(1.2); }
        100% { left: 80%; top: 30%; transform: scale(1.5); opacity: 0; }
      }
      .anim-stream-p2e { animation: stream-p2e linear both; }

      @keyframes stream-e2p {
        0% { left: 80%; top: 30%; transform: scale(0.2); opacity: 0; }
        10% { opacity: 1; transform: scale(0.6); }
        90% { opacity: 1; transform: scale(1.2); }
        100% { left: 20%; top: 70%; transform: scale(1.5); opacity: 0; }
      }
      .anim-stream-e2p { animation: stream-e2p linear both; }

      .vfx-droplet {
        position: absolute;
        background: var(--vfx-color);
        border-radius: 50% 50% 50% 0;
        box-shadow: inset 0 0 5px white, 0 0 10px var(--vfx-color);
        z-index: 70;
      }

      
      @keyframes spin-p2e {
        0% { left: 20%; top: 70%; transform: scale(0.5) rotate(0deg); opacity: 0; }
        1% { opacity: 1; }
        99% { opacity: 1; }
        100% { left: 80%; top: 30%; transform: scale(1.2) rotate(720deg); opacity: 0; }
      }
      .anim-spin-p2e { animation: spin-p2e 0.4s linear both; }

      @keyframes spin-e2p {
        0% { left: 80%; top: 30%; transform: scale(0.5) rotate(0deg); opacity: 0; }
        1% { opacity: 1; }
        99% { opacity: 1; }
        100% { left: 20%; top: 70%; transform: scale(1.2) rotate(-720deg); opacity: 0; }
      }
      .anim-spin-e2p { animation: spin-e2p 0.4s linear both; }

      .vfx-spin {
        position: absolute;
        width: 40px; height: 40px;
        background: var(--vfx-color);
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        filter: drop-shadow(0 0 10px var(--vfx-color)) brightness(1.5);
        z-index: 70;
      }

      .vfx-leaf {
        position: absolute;
        width: 30px; height: 30px;
        background: var(--vfx-color);
        border-radius: 0 50% 0 50%;
        box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        filter: drop-shadow(0 0 10px var(--vfx-color)) brightness(1.2);
        z-index: 70;
      }

      .vfx-spark {
        position: absolute;
        width: 35px; height: 35px;
        background: var(--vfx-color);
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        filter: drop-shadow(0 0 15px var(--vfx-color)) brightness(2);
        z-index: 70;
      }

      .vfx-orb {
        position: absolute;
        width: 40px; height: 40px;
        background: radial-gradient(circle at 30% 30%, white, var(--vfx-color));
        border-radius: 50%;
        box-shadow: 0 0 20px var(--vfx-color), 0 0 40px var(--vfx-color);
        z-index: 70;
      }
      .vfx-orb::before {
         content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
         width: 150%; height: 150%; border-radius: 50%;
         background: radial-gradient(circle, rgba(255,255,255,0.8), transparent 70%);
         opacity: 0.5;
         animation: pulse-fast 0.2s infinite;
      }

      /* --- VFX 3: BEAMS --- */
      @keyframes beam-fire {
        0% { width: 0; opacity: 1; }
        10% { width: 100%; opacity: 1; }
        80% { opacity: 1; height: 50px; }
        100% { opacity: 0; height: 0; }
      }
      .vfx-beam {
        position: absolute;
        height: 50px;
        background: linear-gradient(90deg, rgba(255,255,255,0.8) 0%, var(--vfx-color) 20%, transparent 100%);
        transform-origin: left center;
        box-shadow: 0 0 20px var(--vfx-color);
        z-index: 70;
        border-radius: 25px;
      }

      /* --- VFX 4: IMPACT --- */
      @keyframes strike-down {
        0% { height: 0; opacity: 1; filter: brightness(2); }
        10% { height: 150%; opacity: 1; filter: brightness(2); width: 100px; transform: translateX(-10px); box-shadow: 0 0 50px var(--vfx-color); }
        15% { opacity: 0; width: 0; }
        25% { height: 150%; opacity: 1; filter: brightness(3); width: 180px; transform: translateX(20px); box-shadow: 0 0 100px var(--vfx-color), inset 0 0 30px white; }
        30% { opacity: 0; }
        40% { height: 150%; opacity: 1; filter: brightness(3); width: 140px; transform: translateX(-20px); box-shadow: 0 0 80px var(--vfx-color); }
        100% { opacity: 0; width: 0; }
      }
      .vfx-strike {
        position: absolute;
        width: 100px;
        background: linear-gradient(180deg, rgba(255,255,255,1) 0%, var(--vfx-color) 80%, rgba(255,255,255,0.8) 100%);
        box-shadow: 0 0 40px var(--vfx-color), 0 0 80px var(--vfx-color), inset 0 0 10px white;
        z-index: 70;
        transform-origin: top center;
        animation: strike-down 0.5s ease-out forwards;
        mix-blend-mode: screen;
        clip-path: polygon(10% 0, 90% 0, 50% 10%, 100% 20%, 40% 30%, 80% 40%, 20% 50%, 70% 60%, 10% 70%, 90% 80%, 30% 90%, 50% 100%, 0 85%, 60% 75%, 0 65%, 50% 55%, 0 45%, 60% 35%, 10% 25%, 60% 15%);
      }

      @keyframes shockwave {
        0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 30px; }
        60% { opacity: 0.8; border-width: 10px; }
        100% { transform: translate(-50%, -50%) scale(8.0); opacity: 0; border-width: 0px; }
      }
      .vfx-shockwave {
        position: absolute;
        width: 120px; height: 120px;
        border-radius: 50%;
        border: 2px solid white;
        background: radial-gradient(circle, var(--vfx-color) 0%, rgba(255,255,255,0.8) 40%, transparent 80%);
        animation: shockwave 0.15s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        z-index: 80;
        mix-blend-mode: screen;
        box-shadow: 0 0 40px var(--vfx-color), inset 0 0 20px white;
      }
      
      @keyframes flash-burst {
          0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5) rotate(0deg); }
          40% { opacity: 1; transform: translate(-50%, -50%) scale(8) rotate(45deg); filter: brightness(3); }
          100% { opacity: 0; transform: translate(-50%, -50%) scale(15) rotate(90deg); filter: brightness(1); }
      }
      .vfx-flash {
          position: absolute;
          width: 80px; height: 80px;
          background: radial-gradient(circle, white 20%, var(--vfx-color) 60%, transparent 80%);
          border-radius: 50%;
          animation: flash-burst 0.15s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
          z-index: 81;
          box-shadow: 0 0 80px white;
          mix-blend-mode: screen;
      }

      @keyframes impact-particle-fly {
          0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
          100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; }
      }
      .vfx-impact-particle {
          position: absolute;
          width: var(--size);
          height: var(--size);
          background: white;
          border-radius: 50%;
          box-shadow: 0 0 10px var(--vfx-color), 0 0 20px var(--vfx-color);
          animation: impact-particle-fly 0.3s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
          z-index: 82;
      }

      /* --- PARTICLES --- */
      @keyframes spark-fly {
          0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
          100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(180deg); opacity: 0; }
      }
      @keyframes thunder-strike {
          0% { transform: translate(0, 0) scaleY(1); opacity: 1; filter: brightness(2); }
          50% { transform: translate(calc(var(--tx) / 2), calc(var(--ty) / 2)) scaleY(2) rotate(15deg); filter: brightness(5); }
          100% { transform: translate(var(--tx), var(--ty)) scaleY(0); opacity: 0; filter: brightness(1); }
      }
      @keyframes splash {
          0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
          100% { transform: translate(var(--tx), var(--ty)) scale(0.2) rotate(360deg); opacity: 0; }
      }
      @keyframes ember-fly {
          0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
          50% { filter: brightness(2) drop-shadow(0 0 10px red); opacity: 1; }
          100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(90deg); opacity: 0; }
      }
      .particle-spark {
          position: absolute;
          width: 8px; height: 8px;
          background: var(--vfx-color);
          clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); /* Diamond shape */
          animation: spark-fly 0.6s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
          box-shadow: 0 0 15px var(--vfx-color), 0 0 25px white;
          z-index: 82;
      }
      .particle-thunder {
          position: absolute;
          width: 4px; height: 30px;
          background: white;
          clip-path: polygon(10% 0, 90% 0, 50% 50%, 100% 50%, 30% 100%, 60% 60%, 0 60%); 
          box-shadow: 0 0 15px var(--vfx-color);
          animation: thunder-strike 0.4s ease-out forwards;
          z-index: 82;
      }
      .particle-fire {
          position: absolute;
          width: 10px; height: 10px;
          border-radius: 50%;
          background: radial-gradient(circle, #fbbf24 20%, #ef4444 80%);
          box-shadow: 0 0 10px #f97316;
          animation: ember-fly 0.8s ease-out forwards;
          z-index: 82;
      }
      .particle-water {
          position: absolute;
          width: 8px; height: 12px;
          border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
          background: #60a5fa;
          box-shadow: 0 0 8px #3b82f6;
          animation: splash 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
          z-index: 82;
      }
      .particle-leaf {
          position: absolute;
          width: 12px; height: 6px;
          border-radius: 10px 0 10px 0;
          background: #4ade80;
          box-shadow: 0 0 5px #22c55e;
          animation: spark-fly 1s ease-in forwards;
          z-index: 82;
      }

      /* VFX SLASH */
      @keyframes slash-cut {
          0% { width: 0; opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(1); }
          50% { width: 120%; opacity: 1; }
          100% { width: 120%; opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(0); }
      }
      .vfx-slash {
          position: absolute;
          height: 8px;
          background: white;
          box-shadow: 0 0 15px white, 0 0 30px var(--vfx-color);
          z-index: 75;
          animation: slash-cut 0.3s ease-out forwards;
          border-radius: 4px;
      }

      /* UTILS */
      @keyframes pulse-fast { 0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.2); } }
      @keyframes spin-slow { to { transform: rotate(360deg); } }

      @keyframes shake-hard { 0%, 100% { transform: translate(0,0) rotate(0deg); } 25% { transform: translate(15px, 15px) rotate(5deg); } 75% { transform: translate(-15px, -10px) rotate(-5deg); } }
      .shake-hard { animation: shake-hard 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite; }
      
      @keyframes shake-violent { 0%, 100% { transform: translate(0,0) rotate(0deg) scale(1); filter: brightness(1); } 25% { transform: translate(30px, -30px) rotate(10deg) scale(1.05); filter: brightness(1.5) contrast(1.2); } 50% { transform: translate(-30px, 30px) rotate(-10deg) scale(0.95); filter: brightness(0.8); } 75% { transform: translate(25px, 15px) rotate(8deg) scale(1.03); filter: brightness(1.3); } }
      .shake-violent { animation: shake-violent 0.1s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite; z-index: 100; box-shadow: inset 0 0 200px rgba(255,255,255,0.7); }

      @keyframes shake-soft { 0%, 100% { transform: translate(0,0) rotate(0deg); } 25% { transform: translate(3px, 3px) rotate(1deg); } 75% { transform: translate(-3px, -3px) rotate(-1deg); } }
      .shake-soft { animation: shake-soft 0.2s linear infinite; }

      @keyframes flash-white { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(10) sepia(1); } }
      .filter-flash { animation: flash-white 0.2s ease-in-out; }

      /* CATCH */
      @keyframes throw-curve {
          0% { left: 25%; bottom: 30%; transform: scale(0.5) rotate(0deg); opacity: 1; }
          50% { transform: scale(1.2) rotate(360deg) translateY(-150px); }
          100% { left: 80%; bottom: 65%; transform: scale(0.6) rotate(720deg); opacity: 1; }
      }
      .anim-throw { animation: throw-curve 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

      @keyframes ball-wiggle {
          0%, 100% { transform: rotate(0deg) scale(0.6); }
          25% { transform: rotate(-15deg) scale(0.6); }
          75% { transform: rotate(15deg) scale(0.6); }
      }
      .anim-wiggle { animation: ball-wiggle 0.5s ease-in-out; }

      @keyframes absorb-mon {
          0% { transform: scale(1); filter: brightness(1); opacity: 1; }
          100% { transform: scale(0.1); filter: brightness(100) sepia(1) hue-rotate(-50deg); opacity: 0; }
      }
      .anim-absorb { animation: absorb-mon 0.6s ease-in forwards; }
      
      @keyframes pop-out {
          0% { transform: scale(0.1); opacity: 0; filter: brightness(10); }
          100% { transform: scale(1); opacity: 1; filter: brightness(1); }
      }
      .anim-pop { animation: pop-out 0.4s ease-out forwards; }
      
      .glass-panel {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      /* EVOLUTION SCENE */
      @keyframes evo-flash {
          0%, 100% { filter: brightness(1); }
          50% { filter: brightness(3) sepia(1); }
      }
      .anim-evo-flash {
          animation: evo-flash 0.5s ease-in-out infinite;
      }
      
      @keyframes evo-glow {
          0%, 100% { transform: scale(1); opacity: 0.2; }
          50% { transform: scale(1.5); opacity: 0.8; }
      }
      .anim-evo-glow {
          animation: evo-glow 1s ease-in-out infinite;
      }
      
      /* POKEMON SPAWN & CATCH EFFECTS */
      @keyframes spawn-flash {
          0% { filter: brightness(10) contrast(100); transform: scale(0); opacity: 0; }
          50% { filter: brightness(10) contrast(100); transform: scale(1.1); opacity: 1; }
          100% { filter: brightness(1) contrast(1); transform: scale(1); opacity: 1; }
      }
      .anim-spawn {
          animation: spawn-flash 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes pop-angry {
          0% { transform: scale(0.1); filter: brightness(10) sepia(1) hue-rotate(-50deg); opacity: 1; }
          40% { transform: scale(1.2); filter: brightness(5) sepia(1) hue-rotate(-50deg); }
          100% { transform: scale(1); filter: brightness(1); }
      }
      .anim-pop-angry { animation: pop-angry 0.8s ease-out forwards; }

      @keyframes pop {
          0% { transform: scale(0.1); filter: brightness(10); opacity: 1; }
          100% { transform: scale(1); filter: brightness(1); opacity: 1; }
      }
