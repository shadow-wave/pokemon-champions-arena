  <style>
    :root {
      --vfx-color: #ffffff;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: #030308;
      color: #f8fafc;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      margin: 0;
    }

    .pixel-art {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* --- RESPONSIVE 3D STADIUM ENGINE --- */
    .stadium-viewport {
      perspective: 1200px;
      overflow: hidden;
      background-color: #000;
    }

    .camera-rig {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s ease;
    }

    /* Fluid Camera States */
    .cam-idle { transform: scale(1) translate(0, 0) rotateX(0deg); }
    .cam-p1-atk { transform: scale(1.12) translate(-2%, -4%) rotateY(2deg) rotateX(-2deg); }
    .cam-p2-atk { transform: scale(1.12) translate(2%, 6%) rotateY(-2deg) rotateX(2deg); }
    .cam-catch { transform: scale(1.08) translate(0, -8%); filter: contrast(110%); }

    /* 3D Floor Pedestals (Fluid sizing for all viewports) */
    .battle-pad {
      position: absolute;
      border-radius: 50%;
      transform: rotateX(60deg);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 25px rgba(255,255,255,0.25);
      transition: background 1s ease, border 1s ease, box-shadow 1s ease;
    }

    .pad-player { bottom: 6%; left: 8%; width: min(70vw, 320px); height: min(24vw, 110px); z-index: 10; }
    .pad-enemy { top: 28%; right: 8%; width: min(60vw, 260px); height: min(20vw, 90px); z-index: 5; }

    @media (min-width: 768px) {
      .pad-player { bottom: 10%; left: 15%; width: 360px; height: 130px; }
      .pad-enemy { top: 22%; right: 15%; width: 280px; height: 100px; }
    }

    /* Dynamic Environments */
    .bg-layer { transition: all 1s ease; }
    
    .env-standard .battle-pad { background: radial-gradient(circle, #10b981 30%, #047857 85%); border: 4px solid #34d399; }
    .env-standard .bg-layer { background: linear-gradient(to bottom, #38bdf8, #bae6fd); }
    
    .env-rock .battle-pad { background: radial-gradient(circle, #78716c 30%, #1c1917 85%); border: 4px solid #a8a29e; }
    .env-rock .bg-layer { background: linear-gradient(to bottom, #292524, #57534e); }
    
    .env-water .battle-pad { background: radial-gradient(circle, #0284c7 30%, #032b43 85%); border: 4px solid #38bdf8; box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(56, 189, 248, 0.6); }
    .env-water .bg-layer { background: linear-gradient(to bottom, #075985, #0284c7); }
    
    .env-electric .battle-pad { background: radial-gradient(circle, #ca8a04 30%, #271102 85%); border: 4px solid #fde047; }
    .env-electric .bg-layer { background: linear-gradient(to bottom, #0f172a, #381b04); }
    
    .env-fire .battle-pad { background: radial-gradient(circle, #dc2626 30%, #2d0505 85%); border: 4px solid #fca5a5; box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 45px rgba(239, 68, 68, 0.7); }
    .env-fire .bg-layer { background: linear-gradient(to bottom, #2d0505, #991b1b); }
    
    .env-psychic .battle-pad { background: radial-gradient(circle, #9333ea 30%, #23033d 85%); border: 4px solid #d8b4fe; }
    .env-psychic .bg-layer { background: linear-gradient(to bottom, #1e0b36, #7e22ce); }
    
    .env-poison .battle-pad { background: radial-gradient(circle, #a21caf 30%, #2e0232 85%); border: 4px solid #f0abfc; }
    .env-poison .bg-layer { background: linear-gradient(to bottom, #110e2b, #4a044e); }
    
    .env-dragon .battle-pad { background: radial-gradient(circle, #4f46e5 30%, #0f0d2b 85%); border: 4px solid #818cf8; }
    .env-dragon .bg-layer { background: linear-gradient(to bottom, #090d16, #312e81); }

    /* Parallax Patterns & Weather FX */
    .stadium-lights {
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.45) 0%, transparent 65%);
      mix-blend-mode: overlay;
    }
    .grid-floor {
      background-image: linear-gradient(transparent 90%, rgba(255,255,255,0.12) 90%), linear-gradient(90deg, transparent 90%, rgba(255,255,255,0.12) 90%);
      background-size: 35px 35px;
    }

    .sprite-container {
      position: absolute;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: opacity 0.3s ease;
    }
    
    .sprite-player { bottom: 10%; left: 6%; width: min(42vw, 240px); height: min(42vw, 240px); z-index: 20; }
    .sprite-enemy { top: 16%; right: 6%; width: min(38vw, 210px); height: min(38vw, 210px); z-index: 15; }

    @media (min-width: 768px) {
      .sprite-player { bottom: 14%; left: 16%; width: 280px; height: 280px; }
      .sprite-enemy { top: 10%; right: 16%; width: 250px; height: 250px; }
    }

    .mon-sprite {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6));
      transition: filter 0.3s ease;
    }

    @keyframes sprite-idle {
        0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6)); }
        50% { transform: scale(1.03) translateY(-5px); filter: drop-shadow(0 25px 25px rgba(0,0,0,0.4)); }
    }
    .anim-idle { animation: sprite-idle 3s ease-in-out infinite; }

    @keyframes lunge-p1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(70px, -25px) scale(1.12) rotate(6deg); }
    }
    .anim-lunge-p1 { animation: lunge-p1 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    @keyframes lunge-p2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-70px, 25px) scale(1.12) rotate(-6deg); }
    }
    .anim-lunge-p2 { animation: lunge-p2 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    @keyframes faint-drop {
      0% { transform: translateY(0); opacity: 1; filter: grayscale(0); }
      100% { transform: translateY(60px); opacity: 0; filter: grayscale(1); }
    }
    .anim-faint { animation: faint-drop 1s ease-in forwards; }

    @keyframes shake-hard {
      0%, 100% { transform: translate(0,0); }
      25% { transform: translate(18px, 15px) rotate(2deg); }
      75% { transform: translate(-18px, -12px) rotate(-2deg); }
    }
    .shake-hard { animation: shake-hard 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

    .flash-damage { animation: flash-red 0.4s ease-out forwards; }
    @keyframes flash-red {
      0%, 100% { filter: brightness(1) sepia(0); }
      50% { filter: brightness(3.5) sepia(1) hue-rotate(-50deg) saturate(6); }
    }

    .vfx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }

    .vfx-orb {
      position: absolute; width: 45px; height: 45px;
      background: radial-gradient(circle, #fff, var(--vfx-color));
      border-radius: 50%; box-shadow: 0 0 25px var(--vfx-color), 0 0 50px var(--vfx-color);
      transform: translate(-50%, -50%);
    }

    .vfx-slash {
      position: absolute; width: 0px; height: 14px;
      background: white; box-shadow: 0 0 25px white, 0 0 50px var(--vfx-color);
      transform: translate(-50%, -50%) rotate(var(--rot)); border-radius: 7px;
      animation: slash-anim 0.3s ease-out forwards;
    }
    @keyframes slash-anim { 50% { width: 170px; opacity: 1; } 100% { width: 170px; opacity: 0; } }

    .vfx-beam {
      position: absolute; height: 70px;
      background: linear-gradient(90deg, transparent, white 20%, var(--vfx-color) 50%, transparent);
      box-shadow: 0 0 35px var(--vfx-color); border-radius: 35px;
      transform-origin: left center; animation: beam-anim 0.5s ease-out forwards;
    }
    @keyframes beam-anim { 0% { width: 0; opacity: 1; } 50% { width: 100%; opacity: 1; height: 90px; } 100% { width: 100%; opacity: 0; height: 0px; } }

    .vfx-impact {
      position: absolute; width: 160px; height: 160px; border-radius: 50%;
      background: radial-gradient(circle, white 10%, var(--vfx-color) 40%, transparent 80%);
      transform: translate(-50%, -50%) scale(0); mix-blend-mode: screen;
      animation: impact-anim 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }
    @keyframes impact-anim { 50% { transform: translate(-50%, -50%) scale(1.6); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } }

    @keyframes throw-arc {
      0% { left: 20%; bottom: 20%; transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(360deg) translateY(-120px); }
      100% { left: 75%; bottom: 55%; transform: scale(0.8) rotate(720deg); opacity: 1; }
    }
    .anim-throw-ball { animation: throw-arc 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }

    @keyframes ball-wiggle {
      0%, 100% { transform: rotate(0deg) scale(0.8); }
      25% { transform: rotate(-25deg) scale(0.8); }
      75% { transform: rotate(25deg) scale(0.8); }
    }
    .anim-ball-wiggle { animation: ball-wiggle 0.5s ease-in-out; }
  </style>
</head>

    const GYMS = [
      { id: "pewter", name: "Pewter Gym", leader: "Brock", type: "Rock", env: "env-rock", lvl: 15, team: ["Onix"] },

      { id: "celadon", name: "Celadon Gym", leader: "Erika", type: "Grass", env: "env-grass", lvl: 45, team: ["Venusaur"] },
      { id: "fuchsia", name: "Fuchsia Gym", leader: "Koga", type: "Poison", env: "env-poison", lvl: 55, team: ["Gengar"] },
      { id: "saffron", name: "Saffron Gym", leader: "Sabrina", type: "Psychic", env: "env-psychic", lvl: 65, team: ["Alakazam"] },

      { id: "champion", name: "Pokémon League", leader: "Lance", type: "Dragon", env: "env-dragon", lvl: 85, team: ["Dragonite", "Rayquaza"] }
    ];

    function createCombatant(name, lvl, isBoss = false) {
      const base = POKEDEX[name] || POKEDEX.Pikachu;
      const mult = isBoss ? 1.3 : 1.0;
      const hp = Math.floor(((base.hp * 2 * lvl) / 100 + lvl + 10) * mult);
      return {
        id: crypto.randomUUID(),
        dexId: base.id,
        name: isBoss ? `BOSS ${name}` : name,
        baseName: name,
        type: base.type,
        lvl, hp, maxHp: hp,
        stats: {
          atk: Math.floor(((base.atk * 2 * lvl) / 100 + 5) * mult),
          def: Math.floor(((base.def * 2 * lvl) / 100 + 5) * mult),
          spAtk: Math.floor(((base.spAtk * 2 * lvl) / 100 + 5) * mult),
          spDef: Math.floor(((base.spDef * 2 * lvl) / 100 + 5) * mult),
          spd: Math.floor(((base.spd * 2 * lvl) / 100 + 5) * mult)
        },
        moves: [...base.moves]
      };
    }

    function calcDamage(attacker, defender, move) {
      if(move.power === 0) return { damage: 0, mult: 1, crit: false };
      const isCrit = Math.random() < 0.0625;
      const aStat = move.category === 'Physical' ? attacker.stats.atk : attacker.stats.spAtk;
      const dStat = move.category === 'Physical' ? defender.stats.def : defender.stats.spDef;
      
      let baseDmg = Math.floor(Math.floor(Math.floor(2 * attacker.lvl / 5 + 2) * move.power * (aStat / dStat)) / 50) + 2;
      
      const stab = attacker.type.includes(move.type) ? 1.5 : 1;
      let typeMult = 1;
      defender.type.forEach(t => {
        if(TYPE_CHART[move.type] && TYPE_CHART[move.type][t] !== undefined) typeMult *= TYPE_CHART[move.type][t];
      });

      const random = (Math.floor(Math.random() * 16) + 85) / 100;
      const finalDmg = Math.floor(baseDmg * stab * typeMult * (isCrit ? 1.5 : 1) * random);
      
      return { damage: Math.max(1, finalDmg), mult: typeMult, crit: isCrit };
    }

    const audioCtx = { synth: null, noise: null, active: false };
    function initAudio() {
      if(!audioCtx.synth) {
        audioCtx.synth = new Tone.PolySynth(Tone.Synth).toDestination();
        audioCtx.noise = new Tone.NoiseSynth().toDestination();
        audioCtx.synth.volume.value = -8;
        audioCtx.noise.volume.value = -12;
      }
      Tone.start();
      audioCtx.active = true;
    }
    
    function playSfx(type) {
      if(!audioCtx.active || !audioCtx.synth) return;
      const now = Tone.now();
      switch(type) {
        case 'hit': audioCtx.noise.triggerAttackRelease('16n', now); break;
        case 'super': audioCtx.synth.triggerAttackRelease(['C5','E5','G5'], '8n', now); break;
        case 'faint': audioCtx.synth.triggerAttackRelease(['C3','G2','C2'], '4n', now); break;
        case 'catch': audioCtx.synth.triggerAttackRelease(['C4','E4','G4','C5'], '4n', now); break;
        case 'evo': audioCtx.synth.triggerAttackRelease(['G4','B4','D5','G5'], '2n', now); break;
        case 'ui': audioCtx.synth.triggerAttackRelease('C6', '32n', now); break;
      }
    }

        if(save) {
          setPlayer(JSON.parse(save));
        }
      }, []);

      const saveGame = (data) => {
        setPlayer(data);
        localStorage.setItem('poke_champs_v3', JSON.stringify(data));
      };

      const startNewGame = () => {
        initAudio();
        const newPlayer = {
          name: "Ash",
          money: 3000,
          badges: [],
          team: [createCombatant("Charmander", 5), createCombatant("Squirtle", 5)],
          bag: { pokeBalls: 10, potions: 5 }
        };
        saveGame(newPlayer);
        setScreen('hub');
      };

      if(screen === 'boot') {
        return (
          <div className="h-full flex flex-col items-center justify-center bg-slate-950 text-white relative px-4">

              {player && <button onClick={() => { initAudio(); setScreen('hub'); }} className="px-6 py-3 bg-green-600 rounded-lg font-bold border-b-4 border-green-800 hover:bg-green-500 active:translate-y-1 active:border-b-0 transition-all text-xs sm:text-sm">CONTINUE</button>}
            </div>

      return null;

    const HubScreen = ({ player, setScreen, saveGame }) => {

            </div>

          <h3 className="text-xs text-slate-400 font-bold mb-3 uppercase">Your Party</h3>
          <div className="flex gap-3 overflow-x-auto pb-4 mb-6 no-scrollbar">
            {player.team.map(mon => (

                <img src={`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${mon.dexId}.png`} className="w-12 h-12 pixel-art" />
                <span className="text-[10px] font-bold mt-2 truncate w-full text-center">{mon.name}</span>

                <div className="w-full h-1.5 bg-slate-900 rounded-full mt-2 overflow-hidden">
                  <div className={`h-full ${mon.hp < mon.maxHp*0.2 ? 'bg-red-500' : 'bg-green-500'}`} style={{width: `${(mon.hp/mon.maxHp)*100}%`}}></div>
                </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pb-12">

                     className={`relative p-4 rounded-xl border-2 flex justify-between items-center transition-all ${locked ? 'bg-slate-800 border-slate-700 opacity-60' : 'bg-slate-800 border-indigo-500 hover:scale-[1.02] cursor-pointer shadow-lg'}`}>
                  {cleared && <div className="absolute inset-0 bg-black/60 flex items-center justify-center z-10 rounded-xl"><span className="text-xl font-bold text-yellow-400 rotate-[-15deg] border-4 border-yellow-400 p-2 drop-shadow-md">CLEARED</span></div>}
                  <div>

                    <p className="text-[9px] text-slate-400 mt-1">Leader: {gym.leader} | {gym.type}</p>

                    {locked ? <span className="text-[9px] text-red-400 font-bold">Req Lv.{gym.lvl}</span> : <span className="bg-indigo-600 px-3 py-1.5 rounded text-[9px] font-bold shadow-md">BATTLE</span>}

    const BattleScreen = ({ player, gymId, setScreen, saveGame }) => {
      const gym = GYMS.find(g => g.id === gymId);
      
      const [activeP1, setActiveP1] = useState(0);
      const [activeP2, setActiveP2] = useState(0);
      
      const [enemyTeam] = useState(() => {
        return gym.team.map(mName => createCombatant(mName, gym.lvl, true));

      const [p1, setP1] = useState(player.team[0]);
      const [p2, setP2] = useState(enemyTeam[0]);

      const [logMsg, setLogMsg] = useState(`Leader ${gym.leader} sent out ${p2.name}!`);
      const [menuState, setMenuState] = useState('main');
      const [camState, setCamState] = useState('cam-idle');
      const [vfxList, setVfxList] = useState([]);
      const [locked, setLocked] = useState(false);

      const addVfx = (vfx) => {
        setVfxList(prev => [...prev, vfx]);
        setTimeout(() => {
          setVfxList(prev => prev.filter(v => v.id !== vfx.id));
        }, vfx.duration || 1000);
      };

      const executeMove = async (moveName) => {
        if(locked) return;
        setLocked(true);
        setMenuState('hidden');

        const move = MOVES[moveName];
        
        setLogMsg(`${p1.name} used ${move.name}!`);
        setCamState('cam-p1-atk');
        
        const p1Sprite = document.getElementById('sprite-p1');
        const p2Sprite = document.getElementById('sprite-p2');
        p1Sprite.classList.add('anim-lunge-p1');
        
        await new Promise(r => setTimeout(r, 400));
        
        playSfx('hit');
        addVfx({ id: Date.now(), type: move.vfx, color: move.color, target: 'p2', duration: 600 });
        p2Sprite.classList.add('flash-damage');
        document.getElementById('camera-rig').classList.add('shake-hard');
        
        const dmgRes = calcDamage(p1, p2, move);
        const newP2Hp = Math.max(0, p2.hp - dmgRes.damage);
        setP2(prev => ({...prev, hp: newP2Hp}));

        await new Promise(r => setTimeout(r, 400));
        p1Sprite.classList.remove('anim-lunge-p1');
        p2Sprite.classList.remove('flash-damage');
        document.getElementById('camera-rig').classList.remove('shake-hard');
        setCamState('cam-idle');

        if(dmgRes.mult > 1) { playSfx('super'); setLogMsg("It's super effective!"); await new Promise(r=>setTimeout(r, 800)); }
        else if(dmgRes.mult < 1) { setLogMsg("It's not very effective..."); await new Promise(r=>setTimeout(r, 800)); }

        if(newP2Hp === 0) {
          playSfx('faint');
          setLogMsg(`${p2.name} fainted!`);
          p2Sprite.classList.add('anim-faint');
          await new Promise(r => setTimeout(r, 1200));

            setActiveP2(prev => prev + 1);
            setP2(enemyTeam[activeP2 + 1]);
            p2Sprite.classList.remove('anim-faint');
            setLogMsg(`Leader ${gym.leader} sent out ${enemyTeam[activeP2 + 1].name}!`);
            await new Promise(r => setTimeout(r, 1200));
            setMenuState('main');
            setLocked(false);
          } else {
            playSfx('evo');
            setLogMsg(`You defeated Leader ${gym.leader}!`);
            await new Promise(r => setTimeout(r, 1500));
            
            const updatedPlayer = {...player};
            if(!updatedPlayer.badges.includes(gym.badge)) updatedPlayer.badges.push(gym.badge);
            updatedPlayer.money += 1500;
            saveGame(updatedPlayer);
            
            setScreen('hub');
          }
          return;
        }

        await new Promise(r => setTimeout(r, 400));
        const p2MoveName = p2.moves[Math.floor(Math.random() * p2.moves.length)];
        const p2Move = MOVES[p2MoveName];

        setLogMsg(`Enemy ${p2.name} used ${p2Move.name}!`);
        setCamState('cam-p2-atk');
        p2Sprite.classList.add('anim-lunge-p2');

        await new Promise(r => setTimeout(r, 400));

        playSfx('hit');
        addVfx({ id: Date.now(), type: p2Move.vfx, color: p2Move.color, target: 'p1', duration: 600 });
        p1Sprite.classList.add('flash-damage');
        document.getElementById('camera-rig').classList.add('shake-hard');

        const dmgRes2 = calcDamage(p2, p1, p2Move);
        const newP1Hp = Math.max(0, p1.hp - dmgRes2.damage);
        setP1(prev => ({...prev, hp: newP1Hp}));
        player.team[activeP1].hp = newP1Hp;

        await new Promise(r => setTimeout(r, 400));
        p2Sprite.classList.remove('anim-lunge-p2');
        p1Sprite.classList.remove('flash-damage');
        document.getElementById('camera-rig').classList.remove('shake-hard');
        setCamState('cam-idle');

        if(dmgRes2.mult > 1) { playSfx('super'); setLogMsg("It's super effective!"); await new Promise(r=>setTimeout(r, 800)); }
        else if(dmgRes2.mult < 1) { setLogMsg("It's not very effective..."); await new Promise(r=>setTimeout(r, 800)); }

        if(newP1Hp === 0) {

          await new Promise(r => setTimeout(r, 1200));

            setLogMsg("Choose your next Pokémon!");

            setScreen('hub');

          setLocked(false);
          return;

        setMenuState('main');
        setLocked(false);

      const switchMon = async (idx) => {

        setMenuState('hidden');
        
        const p1Sprite = document.getElementById('sprite-p1');
        
        if(p1.hp > 0) {
          setLogMsg(`${p1.name}, come back!`);
          p1Sprite.classList.add('anim-faint');
          await new Promise(r => setTimeout(r, 800));
        }

        setActiveP1(idx);
        setP1(player.team[idx]);
        p1Sprite.classList.remove('anim-faint');
        
        setLogMsg(`Go! ${player.team[idx].name}!`);
        playSfx('ui');
        await new Promise(r => setTimeout(r, 1200));
        
        setLogMsg(`What will ${player.team[idx].name} do?`);

        setLocked(false);

                <img id="sprite-p2" className="mon-sprite pixel-art anim-idle" src={`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${p2.dexId}.gif`} alt={p2.name} />
              </div>

              {/* PLAYER SPRITE */}
              <div className="sprite-container sprite-player">
                <img id="sprite-p1" className="mon-sprite pixel-art anim-idle" src={`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/back/${p1.dexId}.gif`} alt={p1.name} />

                  </div>
               </div>

               <div className="glass-panel p-2.5 sm:p-3 rounded-2xl w-40 sm:w-56 md:w-64 border-indigo-500/30 mt-20 sm:mt-24 md:mt-32">
                  <div className="flex justify-between items-center text-[8px] sm:text-[9px] mb-1">
                    <span className="font-bold text-indigo-400 truncate">{p1.name}</span>
                    <span className="text-gray-400 font-mono">Lv.{p1.lvl}</span>
                  </div>
                  <div className="w-full h-2 sm:h-2.5 bg-black/80 rounded-full overflow-hidden p-0.5 border border-white/10">
                    <div className={`h-full rounded-full transition-all duration-500 ${p1.hp/p1.maxHp > 0.5 ? 'bg-emerald-400' : p1.hp/p1.maxHp > 0.2 ? 'bg-amber-400' : 'bg-red-500'}`} style={{width: `${(p1.hp/p1.maxHp)*100}%`}}></div>

               </div>
            </div>
          </main>

          {/* ACTION FOOTER */}
          <footer className="h-44 sm:h-48 bg-[#05060d]/95 border-t border-white/10 p-3 flex flex-col max-w-2xl mx-auto w-full z-40">
            <div className="text-[9px] sm:text-[10px] leading-relaxed text-indigo-200 h-10 flex items-center px-3 sm:px-4 rounded-xl bg-white/5 font-mono border border-white/5 mb-2 shadow-inner">
              {logMsg}
            </div>

            {menuState === 'main' && (
              <div className="grid grid-cols-2 gap-2 flex-1">
                <button onClick={() => { playSfx('ui'); setMenuState('fight'); }} className="bg-red-600 hover:bg-red-500 rounded-xl border-b-4 border-red-800 font-bold text-xs sm:text-sm active:translate-y-1 active:border-b-0 flex items-center justify-center gap-2 transition-all">⚔️ FIGHT</button>
                <button onClick={() => { playSfx('ui'); setMenuState('switch'); }} className="bg-green-600 hover:bg-green-500 rounded-xl border-b-4 border-green-800 font-bold text-xs sm:text-sm active:translate-y-1 active:border-b-0 flex items-center justify-center gap-2 transition-all">🔄 POKÉMON</button>
              </div>
            )}

            {menuState === 'fight' && (
              <div className="flex flex-col h-full gap-2">
                <div className="grid grid-cols-2 gap-2 flex-1">
                  {p1.moves.map(mName => {
                    const m = MOVES[mName];
                    if(!m) return null;
                    return (
                      <button key={mName} onClick={() => executeMove(mName)} className="glass-panel p-2 rounded-xl text-left active:scale-95 transition-transform flex flex-col justify-between" style={{borderColor: `${m.color}80`}}>
                        <div className="flex justify-between w-full">
                          <span className="text-[9px] sm:text-[10px] font-bold text-white">{m.name}</span>
                          <span className="text-[7px] sm:text-[8px] font-bold" style={{color: m.color}}>{m.type}</span>
                        </div>
                        <div className="flex justify-between w-full mt-1 opacity-80">
                          <span className="text-[7px] sm:text-[8px] font-mono">PWR {m.power||'--'}</span>
                          {m.power > 0 && <span className="text-[7px] sm:text-[8px] text-yellow-300 font-mono">100%</span>}
                        </div>
                      </button>
                    )
                  })}
                </div>
                <button onClick={() => setMenuState('main')} className="bg-slate-800 p-2 rounded-lg text-[8px] sm:text-[9px] font-bold text-slate-300 hover:bg-slate-700 transition-colors">BACK</button>
              </div>
            )}

            {menuState === 'switch' && (
              <div className="flex flex-col h-full gap-2">
                <div className="flex overflow-x-auto gap-2 flex-1 pb-1 no-scrollbar">
                  {player.team.map((mon, idx) => (
                    <button key={mon.id} disabled={mon.hp <= 0 || idx === activeP1} onClick={() => switchMon(idx)} className={`min-w-[110px] sm:min-w-[120px] p-2 rounded-xl border-2 flex flex-col items-center shrink-0 ${mon.hp <= 0 ? 'bg-red-950/50 border-red-900 opacity-50 grayscale' : idx === activeP1 ? 'bg-slate-700 border-yellow-500' : 'bg-slate-800 border-slate-600 active:scale-95 hover:bg-slate-700'}`}>
                      <img src={`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${mon.dexId}.png`} className="w-9 h-9 sm:w-10 sm:h-10 pixel-art" />
                      <span className="text-[8px] sm:text-[9px] font-bold mt-1 truncate w-full text-center">{mon.name}</span>
                      <span className="text-[7px] sm:text-[8px] font-mono text-slate-400">{mon.hp}/{mon.maxHp}</span>
                    </button>
                  ))}
                </div>
                {!locked && <button onClick={() => setMenuState('main')} className="bg-slate-800 p-2 rounded-lg text-[8px] sm:text-[9px] font-bold text-slate-300 hover:bg-slate-700 transition-colors mt-1">BACK</button>}
              </div>
            )}
          </footer>
        </div>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
