  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --vfx-color: #60a5fa;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: #030308;
      color: #f8fafc;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    .pixel-art {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* --- 3D DYNAMIC CAMERA CHOREOGRAPHY & VIEWPORT --- */
    .perspective-viewport {
      perspective: 1100px;
      perspective-origin: 50% 40%;
    }

    .stadium-stage {
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
    }

    /* Dynamic Camera Motions */
    .cam-intro        { transform: scale(0.92) translateY(-15px) rotateX(4deg); }
    .cam-idle         { transform: scale(1) translateY(0px) rotateX(0deg); }
    .cam-player-focus { transform: scale(1.22) translateY(42px) rotateX(14deg) rotateY(-6deg); }
    .cam-enemy-focus  { transform: scale(1.22) translateY(-42px) rotateX(-10deg) rotateY(6deg); }
    .cam-ult-zoom     { transform: scale(1.35) translateY(0px) rotateX(6deg); filter: contrast(118%) brightness(1.1); }

    /* --- 3D BATTLEGROUND PITCH & PLATFORM --- */
    .battle-pitch {
      transform: rotateX(56deg) translateZ(-45px);
      box-shadow: 0 0 100px rgba(99, 102, 241, 0.4), inset 0 0 90px rgba(0, 0, 0, 0.95);
      transition: all 0.5s ease;
      position: relative;
    }

    /* Dynamic Floor Themes */
    .floor-grass {
      background-color: #15803d;
      background-image: radial-gradient(circle at center, #22c55e 10%, #15803d 70%),
                        linear-gradient(90deg, rgba(255,255,255,0.15) 2px, transparent 2px);
      background-size: 100% 100%, 40px 40px;
      border: 4px solid #4ade80;
    }

    .floor-rock {
      background-color: #292524;
      background-image: radial-gradient(circle at center, #78716c 20%, #1c1917 80%),
                        repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(0,0,0,0.3) 15px, rgba(0,0,0,0.3) 30px);
      border: 4px solid #a8a29e;
    }

    .floor-water {
      background-color: #075985;
      background-image: radial-gradient(circle at 50% 50%, #38bdf8 15%, #0369a1 60%, #082f49 90%);
      background-size: 100% 100%;
      border: 4px solid #7dd3fc;
      box-shadow: inset 0 0 60px rgba(56, 189, 248, 0.6);
    }

    .floor-electric {
      background-color: #422006;
      background-image: linear-gradient(transparent 90%, rgba(250, 204, 21, 0.4) 90%),
                        linear-gradient(90deg, transparent 90%, rgba(250, 204, 21, 0.4) 90%),
                        radial-gradient(circle, #eab308 10%, #713f12 80%);
      background-size: 30px 30px, 30px 30px, 100% 100%;
      border: 4px solid #facc15;
    }

    .floor-fire {
      background-color: #450a0a;
      background-image: radial-gradient(circle at 50% 50%, #f97316 10%, #dc2626 50%, #450a0a 90%);
      border: 4px solid #f87171;
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.5);
    }

    .floor-poison {
      background-color: #3b0764;
      background-image: radial-gradient(circle, #c084fc 15%, #7e22ce 60%, #2e1065 90%);
      border: 4px solid #e879f9;
    }

    .floor-psychic {
      background-color: #500724;
      background-image: radial-gradient(circle, #f472b6 20%, #be185d 60%, #500724 90%);
      border: 4px solid #f472b6;
    }

    .floor-dragon {
      background-color: #1e1b4b;
      background-image: radial-gradient(circle, #818cf8 20%, #3730a3 60%, #0f172a 90%);
      border: 4px solid #a5b4fc;
    }

    .floor-grid {
      background-color: #090d16;
      background-image: linear-gradient(to right, rgba(99, 102, 241, 0.3) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(99, 102, 241, 0.3) 1px, transparent 1px);
      background-size: 36px 36px;
      border: 4px solid #6366f1;
    }

    /* Pedestals */
    .mon-pedestal {
      position: absolute;
      border-radius: 50%;
      transform: rotateX(60deg);
      box-shadow: 0 0 30px rgba(255,255,255,0.3), inset 0 0 15px rgba(255,255,255,0.5);
    }

    /* --- SPRITE IDLE & ATTACK ANIMATIONS --- */
    @keyframes sprite-idle {
      0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 18px 18px rgba(0,0,0,0.65)); }
      50% { transform: translateY(-8px) scale(1.03); filter: drop-shadow(0 28px 28px rgba(0,0,0,0.4)); }
    }
    .anim-idle { animation: sprite-idle 2.6s ease-in-out infinite; }

    @keyframes lunge-p2e {
      0% { transform: translateX(0) scale(1); }
      50% { transform: translateX(90px) translateY(-18px) scale(1.22) rotate(5deg); }
      100% { transform: translateX(0) scale(1); }
    }
    .anim-lunge-player { animation: lunge-p2e 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    @keyframes lunge-e2p {
      0% { transform: translateX(0) scale(1); }
      50% { transform: translateX(-90px) translateY(18px) scale(1.22) rotate(-5deg); }
      100% { transform: translateX(0) scale(1); }
    }
    .anim-lunge-enemy { animation: lunge-e2p 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    @keyframes shake-hard {
      0%, 100% { transform: translate(0,0); }
      20% { transform: translate(-14px, 12px) rotate(-1deg); }
      40% { transform: translate(14px, -12px) rotate(1deg); }
      60% { transform: translate(-8px, 6px); }
      80% { transform: translate(8px, -6px); }
    }
    .shake-hard { animation: shake-hard 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

    @keyframes damage-flash {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(7) contrast(200%) drop-shadow(0 0 35px #ef4444); }
    }
    .flash-fx { animation: damage-flash 0.32s ease-out; }

    /* --- VFX PROJECTILES & SHOCKWAVES --- */
    @keyframes shockwave-grow {
      0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 25px; }
      100% { transform: translate(-50%, -50%) scale(6.5); opacity: 0; border-width: 0px; }
    }
    .vfx-shockwave {
      position: absolute; width: 110px; height: 110px; border-radius: 50%;
      border: 2px solid white; background: radial-gradient(circle, var(--vfx-color) 0%, rgba(255,255,255,0.8) 40%, transparent 80%);
      animation: shockwave-grow 0.38s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      z-index: 75; mix-blend-mode: screen;
    }

    /* --- CATCH & EVOLUTION --- */
    @keyframes throw-curve {
      0% { left: 20%; bottom: 25%; transform: scale(0.6) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.3) rotate(360deg) translateY(-140px); }
      100% { left: 75%; bottom: 65%; transform: scale(0.65) rotate(720deg); opacity: 1; }
    }
    .anim-throw { animation: throw-curve 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    @keyframes ball-wiggle {
      0%, 100% { transform: rotate(0deg) scale(0.65); }
      25% { transform: rotate(-25deg) scale(0.65); }
      75% { transform: rotate(25deg) scale(0.65); }
    }
    .anim-wiggle { animation: ball-wiggle 0.45s ease-in-out; }

    @keyframes evo-flash {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(10) contrast(150%) drop-shadow(0 0 50px white); transform: scale(1.15); }
    }
    .anim-evo-flash { animation: evo-flash 0.5s ease-in-out infinite; }

    /* Environment Weather Effects */
    .anim-rain {
      background-image: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4) 60%, transparent 100%);
      background-size: 2px 45px; animation: rain-fall 0.45s linear infinite; transform: rotate(12deg) scale(1.4);
    }
    @keyframes rain-fall { 0% { background-position: 0 0; } 100% { background-position: -40px 100vh; } }

    /* Swaying 3D Grass Blades */
    @keyframes grass-sway {
      0%, 100% { transform: skewX(0deg); }
      50% { transform: skewX(7deg); }
    }
    .grass-blade {
      border-radius: 100% 0 0 0;
      animation: grass-sway 2.8s ease-in-out infinite;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>

    function ds(name, lvl, isBoss = false) {
      const template = POKEDEX[name] || POKEDEX.Bulbasaur;
      const mult = isBoss ? 1.3 : 1.0;
      const c = stat => Math.floor(((stat * 2 * lvl) / 100 + 5) * mult);
      const maxHp = Math.floor(((template.hp * 2 * lvl) / 100 + lvl + 10) * mult);

      let moves = [...template.moves];
      if (template.learnset) {
        Object.entries(template.learnset).forEach(([reqLvl, mName]) => {
          if (Number(reqLvl) <= lvl && !moves.includes(mName)) {
            if (moves.length >= 4) moves.shift();
            moves.push(mName);
          }
        });
      }

      return {
        uuid: crypto.randomUUID(),
        id: template.id,
        name: isBoss ? `BOSS ${name}` : name,
        type: template.type,
        lvl,
        hp: maxHp,
        maxHp,
        xp: Math.pow(lvl, 3),
        nextXp: Math.pow(lvl + 1, 3),
        stats: { atk: c(template.atk), def: c(template.def), spAtk: c(template.spAtk), spDef: c(template.spDef), spd: c(template.spd) },
        stages: { atk: 0, def: 0, spAtk: 0, spDef: 0, spd: 0, acc: 0, eva: 0 },
        status: null,
        moves: moves.slice(-4),
        sprites: {
          front: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${template.id}.gif`,
          back: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/back/${template.id}.gif`
        }
      };
    }

    function Yx(mon, expGained) {
      mon.xp += expGained;
      let leveledUp = false;
      let newMoves = [];

      while (mon.xp >= mon.nextXp && mon.lvl < 100) {
        mon.lvl++;
        mon.nextXp = Math.pow(mon.lvl + 1, 3);
        leveledUp = true;

        const base = POKEDEX[mon.name] || POKEDEX.Bulbasaur;
        const oldMax = mon.maxHp;
        mon.maxHp = Math.floor((base.hp * 2 * mon.lvl) / 100 + mon.lvl + 10);
        mon.hp += mon.maxHp - oldMax;

        const learned = base.learnset ? base.learnset[mon.lvl] : null;
        if (learned && !mon.moves.includes(learned)) {
          newMoves.push(learned);
          if (mon.moves.length >= 4) mon.moves.shift();
          mon.moves.push(learned);
        }
      }

      const baseInfo = POKEDEX[mon.name];
      const readyToEvolve = !!(baseInfo && baseInfo.evolution && mon.lvl >= baseInfo.evolution.level);
      return { p: mon, leveledUp, newMoves, readyToEvolve };
    }

    function Hx(mon) {
      const info = POKEDEX[mon.name];
      if (!info || !info.evolution) return mon;
      const nextName = info.evolution.to;
      const nextBase = POKEDEX[nextName];
      if (!nextBase) return mon;

      mon.name = nextName;
      mon.id = nextBase.id;
      mon.type = nextBase.type;
      mon.maxHp = Math.floor((nextBase.hp * 2 * mon.lvl) / 100 + mon.lvl + 10);
      mon.hp = mon.maxHp;
      mon.sprites = {
        front: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${nextBase.id}.gif`,
        back: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/back/${nextBase.id}.gif`
      };
      return mon;
    }

    function Qx(attacker, defender, move) {
      if (move.category === "Status") return { damage: 0, critical: false, effectiveness: 1, missed: false };
      
      const accDiff = (attacker.stages.acc || 0) - (defender.stages.eva || 0);
      const accuracyMultiplier = [0.33, 0.38, 0.43, 0.5, 0.6, 0.75, 1, 1.33, 1.66, 2, 2.33, 2.66, 3][Math.max(0, Math.min(12, accDiff + 6))];
      if (Math.random() > (move.accuracy * accuracyMultiplier)) return { damage: 0, critical: false, effectiveness: 0, missed: true };

      const isCrit = Math.random() < 0.0625;
      const critMultiplier = isCrit ? 1.5 : 1.0;

      const getStat = (mon, statName, isAtk) => {
        let stage = mon.stages[statName] || 0;
        if (isCrit && isAtk && stage < 0) stage = 0;
        if (isCrit && !isAtk && stage > 0) stage = 0;
        const mult = stage >= 0 ? (2 + stage) / 2 : 2 / (2 + Math.abs(stage));
        let val = mon.stats[statName] * mult;
        if (isAtk && mon.status === "brn" && move.category === "Physical") val *= 0.5;
        if (statName === "spd" && mon.status === "par") val *= 0.5;
        return val;
      };

      let aStat, dStat;
      if (move.category === "Physical") {
        aStat = getStat(attacker, "atk", true);
        dStat = getStat(defender, "def", false);
      } else {
        aStat = getStat(attacker, "spAtk", true);
        dStat = getStat(defender, "spDef", false);
      }

      let baseDmg = Math.floor(Math.floor(Math.floor((2 * attacker.lvl) / 5 + 2) * move.power * (aStat / dStat)) / 50) + 2;
      const stab = attacker.type.includes(move.type) ? 1.5 : 1.0;
      
      let typeMult = 1.0;
      defender.type.forEach(t => {
        if (TYPE_CHART[move.type] && TYPE_CHART[move.type][t] !== undefined) typeMult *= TYPE_CHART[move.type][t];
      });

      const randomFactor = (Math.floor(Math.random() * 16) + 85) / 100;
      baseDmg = Math.floor(baseDmg * stab * typeMult * critMultiplier * randomFactor);
      if (baseDmg === 0 && typeMult > 0 && move.power > 0) baseDmg = 1;

      return { damage: baseDmg, critical: isCrit, effectiveness: typeMult, missed: false };
    }

    function xy(mon, ballRate = 1) {
      const maxHp = mon.maxHp;
      const hp = mon.hp;
      const catchRate = POKEDEX[mon.name] ? POKEDEX[mon.name].catchRate || 45 : 45;
      let statusMult = 1.0;
      if (mon.status === "frz" || mon.status === "slp") statusMult = 2.5;
      else if (mon.status === "par" || mon.status === "psn" || mon.status === "brn") statusMult = 1.5;

      let a = Math.floor((3 * maxHp - 2 * hp) * catchRate * ballRate / (3 * maxHp) * statusMult);
      if (a >= 255) return { success: true, shakes: 3, probability: 100 };

      const b = 65536 / Math.pow(255 / a, 0.1875);
      let shakes = 0;
      for (let i = 0; i < 4; i++) {
        if (Math.floor(Math.random() * 65536) < b) shakes++;
      }
      const success = shakes === 4;
      return { success, shakes: success ? 3 : Math.min(3, shakes) };
    }

    let audioActive = false;
    let polySynth, noiseSynth;

    function toggleAudio() {
      if (!polySynth) {
        polySynth = new Tone.PolySynth(Tone.Synth).toDestination();
        noiseSynth = new Tone.NoiseSynth().toDestination();
      }
      Tone.start();
      audioActive = !audioActive;
      const textEl = document.getElementById('audio-text');
      const iconEl = document.getElementById('audio-icon');
      if (textEl) textEl.innerText = audioActive ? "Audio: ON" : "Audio: OFF";
      if (iconEl) iconEl.className = audioActive ? "fa-solid fa-volume-high text-emerald-400" : "fa-solid fa-volume-xmark text-rose-400";
      if (audioActive) polySynth.triggerAttackRelease(['C4', 'E4', 'G4'], '8n');
    }

    function playSfx(type) {
      if (!audioActive || !polySynth) return;
      try {
        const now = Tone.now();
        if (type === 'hit') noiseSynth.triggerAttackRelease('16n', now);
        else if (type === 'super') polySynth.triggerAttackRelease(['G4', 'C5', 'E5'], '8n', now);
        else if (type === 'crit') polySynth.triggerAttackRelease(['A4', 'A5'], '16n', now);
        else if (type === 'faint') polySynth.triggerAttackRelease(['G3', 'Eb3', 'C3'], '4n', now);
        else if (type === 'catch') polySynth.triggerAttackRelease(['C5', 'G4', 'C4'], '8n', now);
        else if (type === 'evo') polySynth.triggerAttackRelease(['C4', 'E4', 'G4', 'C5'], '4n', now);
        else if (type === 'click') polySynth.triggerAttackRelease('G5', '32n', now);
        else if (type === 'heal') polySynth.triggerAttackRelease(['C4', 'E4', 'G4', 'C5'], '8n', now);
      } catch(e) {}
    }

    function GameEngine() {
      const [view, setView] = useState("start");
      const [player, setPlayer] = useState(null);
      const [battleMode, setBattleMode] = useState("ai");
      const [playerParty, setPlayerParty] = useState([]);
      const [enemyParty, setEnemyParty] = useState([]);
      const [gymId, setGymId] = useState(null);
      const [evolvingMon, setEvolvingMon] = useState(null);
      const [peerConn, setPeerConn] = useState(null);
      const [badgeWon, setBadgeWon] = useState(null);

      const SAVE_KEY = "poke_champions_ultimate_v40";

      const initContext = useCallback(() => {
        if (Tone.context.state !== "running") Tone.start();
      }, []);

      const loadSave = () => {
        initContext();
        const data = localStorage.getItem(SAVE_KEY);
        if (data) {
          const parsed = JSON.parse(data);
          setPlayer(parsed);
          setView("hub");
        }
      };

      const startNewGame = trainerName => {
        initContext();
        const defaultParty = [ds("Bulbasaur", 5), ds("Charmander", 5), ds("Squirtle", 5)];
        const newPlayer = {
          name: trainerName,
          wins: 0,
          team: defaultParty,
          box: [],
          bag: { potions: 5, pokeBalls: 10, greatBalls: 3, ultraBalls: 1, masterBalls: 0 },
          badges: [],
          money: 1000
        };
        setPlayer(newPlayer);
        saveGame(newPlayer);
        setView("hub");
      };

      const saveGame = pData => {
        localStorage.setItem(SAVE_KEY, JSON.stringify(pData));
      };

      const handleBattleEnd = (winner, isCaught, activeUuids, updatedTeam) => {
        if (peerConn) {
          peerConn.close();
          setPeerConn(null);
        }
        if (!player) return;

        const updatedPlayer = { ...player };
        updatedTeam.forEach(mon => {
          const idx = updatedPlayer.team.findIndex(m => m.uuid === mon.uuid);
          if (idx !== -1) {
            updatedPlayer.team[idx] = { ...updatedPlayer.team[idx], hp: mon.hp, status: mon.status, stages: mon.stages };
          }
        });

        let newBadge = null;
        if (winner === "p1" && !isCaught) {
          updatedPlayer.wins += 1;
          let rewardMoney = 150 + Math.floor(Math.random() * 100);

          if ((battleMode === "gym" || battleMode === "island") && gymId) {
            const stage = GYMS.find(g => g.id === gymId) || TRIALS.find(t => t.id === gymId);
            if (stage && !updatedPlayer.badges.includes(stage.badge)) {
              updatedPlayer.badges.push(stage.badge);
              newBadge = stage.badge;
              setBadgeWon(stage.badge);
            }
            rewardMoney = 1500 + stage.minLevel * 20;
            setGymId(null);
          }

          updatedPlayer.money += rewardMoney;
          updatedPlayer.bag.pokeBalls += 2;
          updatedPlayer.bag.potions += 1;

          // EXP Yield Distribution
          let totalExp = 0;
          enemyParty.forEach(eMon => {
            const expBase = POKEDEX[eMon.name]?.isLegend ? 250 : 150;
            totalExp += Math.floor((expBase * eMon.lvl) / 5);
          });

          const activeMons = activeUuids.filter(id => updatedPlayer.team.some(m => m.uuid === id));
          if (activeMons.length > 0) {
            const expPerMon = Math.floor(totalExp / activeMons.length);
            let evoPending = null;

            activeMons.forEach(id => {
              const idx = updatedPlayer.team.findIndex(m => m.uuid === id);
              if (idx !== -1 && updatedPlayer.team[idx].hp > 0) {
                const res = Yx(updatedPlayer.team[idx], expPerMon);
                updatedPlayer.team[idx] = res.p;
                if (res.readyToEvolve && !evoPending) {
                  const oldCopy = { ...updatedPlayer.team[idx] };
                  const evolvedCopy = Hx(oldCopy);
                  if (evolvedCopy.name !== oldCopy.name) {
                    evoPending = { old: oldCopy, new: evolvedCopy, index: idx };
                  }
                }
              }
            });

            if (evoPending) {
              setEvolvingMon(evoPending);
              setPlayer(updatedPlayer);
              saveGame(updatedPlayer);
              setView("evolution");
              return;
            }
          }
        }

        setPlayer(updatedPlayer);
        saveGame(updatedPlayer);
        setGymId(null);
        setView(newBadge ? "badge_celebration" : "hub");
      };

      const handleCatch = (caughtMon, ballType) => {
        if (!player) return;
        const updated = { ...player };
        if (updated.team.length < 6) updated.team.push(caughtMon);
        else updated.box.push(caughtMon);
        updated.bag[ballType] = Math.max(0, updated.bag[ballType] - 1);
        setPlayer(updated);
        saveGame(updated);
      };

      const startWildBattle = selectedParty => {
        setPlayerParty(selectedParty);
        const avgLvl = Math.floor(selectedParty.reduce((acc, m) => acc + m.lvl, 0) / selectedParty.length);
        const isBossEncounter = (player?.wins || 0) % 3 === 0 && Math.random() < 0.5;
        const legendList = ["Mewtwo", "Rayquaza", "Arceus"];
        const normalList = Object.keys(POKEDEX).filter(k => !POKEDEX[k].isLegend);
        const choice = isBossEncounter ? legendList[Math.floor(Math.random() * legendList.length)] : normalList[Math.floor(Math.random() * normalList.length)];
        
        setEnemyParty([ds(choice, avgLvl + (isBossEncounter ? 3 : 0), isBossEncounter)]);
        setBattleMode("ai");
        setGymId(null);
        setView("battle");
      };

      const startGymBattle = selectedParty => {
        if (!gymId) return;
        const stage = GYMS.find(g => g.id === gymId) || TRIALS.find(t => t.id === gymId);
        if (!stage) return;

        setPlayerParty(selectedParty);
        const enemies = stage.team.map(m => ds(m.name, m.lvl, true));
        setEnemyParty(enemies);
        setBattleMode(GYMS.some(g => g.id === gymId) ? "gym" : "island");
        setView("battle");
      };

      const healAllTeam = async () => {
        if (!player) return;
        const cost = 100;
        if (player.money < cost) {
          alert("Not enough money to heal team!");
          return;
        }

        playSfx('heal');
        const updated = { ...player };
        updated.money -= cost;
        updated.team.forEach(mon => {
          mon.hp = mon.maxHp;
          mon.status = null;
          mon.stages = { atk: 0, def: 0, spAtk: 0, spDef: 0, spd: 0, acc: 0, eva: 0 };

        setPlayer(updated);
        saveGame(updated);

          {view === "shop" && player && <PokeMart player={player} onBack={() => setView("hub")} onBuy={(itemKey, cost, qty) => { if (player.money >= cost) { const updated = { ...player }; updated.money -= cost; updated.bag[itemKey] = (updated.bag[itemKey] || 0) + qty; setPlayer(updated); saveGame(updated); } }} />}
          {view === "team_select" && player && <SelectParty roster={player.team} player={player} onConfirm={selected => { if (battleMode === "online") { if (peerConn) { setPlayerParty(selected); peerConn.send({ type: "HANDSHAKE", team: selected }); peerConn.once("data", d => { if (d.type === "HANDSHAKE") { setEnemyParty(d.team); setView("battle"); } }); } } else if (battleMode === "gym" || battleMode === "island") startGymBattle(selected); else startWildBattle(selected); }} onBack={() => { setGymId(null); setView(battleMode === "online" ? "lobby" : "hub"); }} />}
          {view === "lobby" && <PVPLobby onConnect={conn => { setPeerConn(conn); setBattleMode("online"); setView("team_select"); }} onBack={() => setView("hub")} />}
          {view === "battle" && player && <BattleScene playerParty={playerParty} enemyParty={enemyParty} mode={battleMode} onBattleEnd={handleBattleEnd} onCatch={handleCatch} inventory={player.bag} peerConn={peerConn} gymId={gymId} />}
          {view === "evolution" && evolvingMon && <EvolutionScene oldMon={evolvingMon.old} newMon={evolvingMon.new} onComplete={() => { const updated = { ...player }; updated.team[evolvingMon.index] = evolvingMon.new; setPlayer(updated); saveGame(updated); setEvolvingMon(null); setView(badgeWon ? "badge_celebration" : "hub"); }} />}
          {view === "badge_celebration" && badgeWon && <BadgeCelebration badge={badgeWon} onContinue={() => { setBadgeWon(null); setView("hub"); }} />}

    function BattleScene({ playerParty, enemyParty, mode, onBattleEnd, onCatch, inventory, peerConn, gymId }) {
      const [pIdx, setPIdx] = useState(0);
      const [eIdx, setEIdx] = useState(0);
      const [logMsg, setLogMsg] = useState("Stadium match ready!");
      const [isLocked, setIsLocked] = useState(false);
      const [activeUuids, setActiveUuids] = useState(new Set([playerParty[0]?.uuid]));
      const [camState, setCamState] = useState("cam-idle");

      const pMon = playerParty[pIdx];
      const eMon = enemyParty[eIdx];

      // Determine Floor Theme
      const currentGym = GYMS.find(g => g.id === gymId) || TRIALS.find(t => t.id === gymId);
      const floorTheme = currentGym ? currentGym.floor : (mode === "online" ? "floor-grid" : "floor-grass");

      useEffect(() => {
        if (pMon) setActiveUuids(prev => new Set(prev).add(pMon.uuid));
      }, [pIdx]);

      const executePlayerMove = async move => {
        if (isLocked || pMon.hp <= 0 || eMon.hp <= 0) return;
        setIsLocked(true);

        const pSprite = document.getElementById('player-sprite');
        const eSprite = document.getElementById('enemy-sprite');
        const scene = document.getElementById('battle-scene');

        // Dynamic 3D Camera Pan to Player Attack Angle
        setCamState(move.power >= 100 ? 'cam-ult-zoom' : 'cam-player-focus');
        pSprite.classList.add('anim-lunge-player');
        setLogMsg(`${pMon.name} used ${move.name}!`);
        playSfx('hit');

        setTimeout(() => {
          pSprite.classList.remove('anim-lunge-player');
          setCamState('cam-idle');

          const result = Qx(pMon, eMon, move);
          eMon.hp = Math.max(0, eMon.hp - result.damage);

          eSprite.classList.add('flash-fx');
          scene.classList.add('shake-hard');
          if (result.effectiveness > 1.0) playSfx('super'); else playSfx('hit');

          setTimeout(() => {
            eSprite.classList.remove('flash-fx');
            scene.classList.remove('shake-hard');

            if (result.effectiveness > 1.0) setLogMsg("It's super effective! 💥");
            else if (result.effectiveness < 1.0 && result.effectiveness > 0) setLogMsg("It's not very effective...");
            else if (result.missed) setLogMsg("The move missed!");

            if (eMon.hp <= 0) {
              setLogMsg(`Enemy ${eMon.name} fainted!`);
              playSfx('faint');
              if (eIdx + 1 < enemyParty.length) {
                setTimeout(() => {
                  setEIdx(eIdx + 1);
                  setIsLocked(false);
                }, 1200);
              } else {
                setTimeout(() => onBattleEnd("p1", false, Array.from(activeUuids), playerParty), 1500);
              }
              return;
            }

            setTimeout(executeEnemyTurn, 900);
          }, 400);
        }, 380);
      };

      const executeEnemyTurn = () => {
        const pSprite = document.getElementById('player-sprite');
        const eSprite = document.getElementById('enemy-sprite');
        const scene = document.getElementById('battle-scene');

        const mName = eMon.moves[Math.floor(Math.random() * eMon.moves.length)];
        const move = MOVES[mName] || { name: mName, type: eMon.type[0], power: 60 };

        // Dynamic 3D Camera Pan to Enemy Attack Angle
        setCamState('cam-enemy-focus');
        eSprite.classList.add('anim-lunge-enemy');
        setLogMsg(`Enemy ${eMon.name} used ${move.name}!`);
        playSfx('hit');

        setTimeout(() => {
          eSprite.classList.remove('anim-lunge-enemy');
          setCamState('cam-idle');

          const result = Qx(eMon, pMon, move);
          pMon.hp = Math.max(0, pMon.hp - result.damage);

          pSprite.classList.add('flash-fx');
          scene.classList.add('shake-hard');

          setTimeout(() => {
            pSprite.classList.remove('flash-fx');
            scene.classList.remove('shake-hard');

            if (pMon.hp <= 0) {
              setLogMsg(`${pMon.name} fainted!`);
              playSfx('faint');
              const nextHealthy = playerParty.findIndex((m, i) => i !== pIdx && m.hp > 0);
              if (nextHealthy !== -1) {
                setTimeout(() => {
                  setPIdx(nextHealthy);
                  setIsLocked(false);
                }, 1200);
              } else {
                setTimeout(() => onBattleEnd("p2", false, Array.from(activeUuids), playerParty), 1500);
              }
              return;
            }

            setIsLocked(false);
            setLogMsg(`What will ${pMon.name} do?`);
          }, 400);
        }, 380);
      };

      const throwPokeball = ballType => {
        if (isLocked || mode !== "ai") return;
        setIsLocked(true);
        const item = ITEMS[ballType];
        setLogMsg(`Threw a ${item.name}!`);

        const vfx = document.getElementById('vfx-layer');
        const ball = document.createElement('div');
        ball.className = 'absolute w-8 h-8 rounded-full bg-red-600 border-2 border-white shadow-2xl anim-throw z-50';
        vfx.appendChild(ball);

        setTimeout(() => {
          const eSprite = document.getElementById('enemy-sprite');
          eSprite.classList.add('anim-absorb');

          setTimeout(() => {
            ball.className = 'absolute w-8 h-8 rounded-full bg-red-600 border-2 border-white shadow-2xl anim-wiggle z-50';
            ball.style.left = '75%';
            ball.style.top = '35%';

            const catchResult = xy(eMon, item.rate);
            setTimeout(() => {
              ball.remove();
              if (catchResult.success) {
                setLogMsg(`Gotcha! ${eMon.name} was caught! 🎉`);
                playSfx('catch');
                setTimeout(() => {
                  onCatch(eMon, ballType);
                  onBattleEnd("p1", true, Array.from(activeUuids), playerParty);
                }, 1500);
              } else {
                setLogMsg(`Oh no! ${eMon.name} broke free!`);
                eSprite.classList.remove('anim-absorb');
                eSprite.style.opacity = '1';
                setTimeout(executeEnemyTurn, 900);
              }
            }, 1200);
          }, 600);
        }, 750);
      };

      return (
        <div className="w-full h-full flex flex-col">
          <main id="battle-scene" className={`flex-1 stadium-viewport relative overflow-hidden flex flex-col justify-between p-4 pb-2 perspective-viewport`}>
            <div id="vfx-layer" className="absolute inset-0 pointer-events-none z-30"></div>

            <div className={`stadium-stage w-full h-full flex flex-col justify-between ${camState}`}>
              <div class="w-full flex justify-between items-start max-w-xl mx-auto z-20 px-2">
                <div class="glass-panel p-3 rounded-2xl w-56 border-rose-500/20 shadow-2xl">
                  <div class="flex justify-between items-center text-[9px] mb-1">
                    <span class="font-bold text-rose-400">{eMon.name}</span>
                    <span class="text-gray-400 font-mono">Lv.{eMon.lvl}</span>
                  </div>
                  <div class="w-full h-2.5 bg-black/60 rounded-full overflow-hidden p-0.5 border border-white/10">
                    <div class="h-full bg-emerald-400 rounded-full transition-all duration-500" style={{ width: `${Math.max(0, (eMon.hp / eMon.maxHp) * 100)}%` }}></div>
                  </div>
                </div>
                <div class="relative w-36 h-36 flex items-center justify-center">
                  <div class="mon-pedestal w-32 h-10 bg-indigo-500/20 border border-indigo-400/40 bottom-0"></div>
                  <img id="enemy-sprite" class="pokemon-sprite pixel-art anim-idle w-32 h-32 object-contain relative z-10" src={eMon.sprites.front} />
                </div>
              </div>

              <div id="battle-platform" class={`absolute inset-x-8 top-1/3 bottom-20 battle-pitch ${floorTheme} rounded-[44px] -z-10 flex items-center justify-center`}></div>

              <div class="w-full flex justify-between items-end max-w-xl mx-auto z-20 px-2">
                <div class="relative w-36 h-36 flex items-center justify-center">
                  <div class="mon-pedestal w-32 h-10 bg-emerald-500/20 border border-emerald-400/40 bottom-0"></div>
                  <img id="player-sprite" class="pokemon-sprite pixel-art anim-idle w-32 h-32 object-contain relative z-10" src={pMon.sprites.back} />
                </div>
                <div class="glass-panel p-3 rounded-2xl w-56 border-indigo-500/30 shadow-2xl mb-2">
                  <div class="flex justify-between items-center text-[9px] mb-1">
                    <span class="font-bold text-indigo-400">{pMon.name}</span>
                    <span class="text-gray-400 font-mono">Lv.{pMon.lvl}</span>
                  </div>
                  <div class="w-full h-2.5 bg-black/60 rounded-full overflow-hidden p-0.5 border border-white/10">
                    <div class="h-full bg-emerald-400 rounded-full transition-all duration-500" style={{ width: `${Math.max(0, (pMon.hp / pMon.maxHp) * 100)}%` }}></div>
                  </div>
                  <div class="flex justify-between items-center text-[8px] mt-1 text-gray-400 font-mono">
                    <span>{Math.round(pMon.hp)}/{pMon.maxHp}</span>
                  </div>
                </div>
              </div>
            </div>
          </main>

          <footer className="h-44 bg-[#05060d]/95 border-t border-white/10 p-3 flex flex-col justify-between max-w-2xl mx-auto w-full z-40">
            <div id="battle-log" className="text-[9px] text-indigo-200 h-8 flex items-center px-3 rounded-xl bg-white/5 font-mono border border-white/5">
              {logMsg}
            </div>

            <div className="grid grid-cols-2 gap-2 mt-2">
              {pMon.moves.map(mName => {
                const m = MOVES[mName] || { name: mName, type: "Normal", power: 50 };
                const range = Xx(pMon, eMon, m);
                return (
                  <button key={mName} onClick={() => executePlayerMove(m)} className="p-2.5 rounded-xl glass-panel flex flex-col text-left hover:border-indigo-500/50 active:scale-95 transition">
                    <span className="text-[9px] font-bold text-white">{m.name}</span>
                    <div className="flex justify-between w-full mt-0.5">
                      <span className="text-[7.5px] font-mono text-blue-400">{m.type}</span>
                      <span className="text-[7.5px] font-mono text-yellow-300">{range[0]}-{range[1]} HP</span>
                    </div>
                  </button>
                );
              })}
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GameEngine />);
  </script>
</body>
</html>
