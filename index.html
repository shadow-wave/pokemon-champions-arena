<html lang="en">

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --vfx-color: #ffffff;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: #030308;
      color: #f8fafc;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      margin: 0;
    }

    .pixel-art {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }

    .stadium-viewport {
      perspective: 1000px;
      overflow: hidden;
    }

    .camera-rig {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s ease;
    }

    /* Fluid Camera States */
    .cam-idle { transform: scale(1) translate(0, 0); }
    .cam-p1-atk { transform: scale(1.15) translate(-5%, -8%) rotateY(3deg) rotateX(-2deg); }
    .cam-p2-atk { transform: scale(1.15) translate(5%, 10%) rotateY(-3deg) rotateX(2deg); }
    .cam-catch { transform: scale(1.1) translate(0, -10%); filter: contrast(110%); }

    /* 3D Floor Pedestals */
    .battle-pad {
      position: absolute;
      border-radius: 50%;
      transform: rotateX(65deg);
      box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 20px rgba(255,255,255,0.2);
      transition: background 1s ease, border 1s ease, box-shadow 1s ease;
    }

    .pad-player { bottom: 12%; left: 5%; width: 280px; height: 110px; z-index: 10; }
    .pad-enemy { top: 28%; right: 10%; width: 220px; height: 85px; z-index: 5; }

    /* Dynamic Environments */
    .env-standard .battle-pad { background: radial-gradient(circle, #10b981 30%, #064e3b 80%); border: 5px solid #34d399; }
    .env-standard .bg-layer { background: linear-gradient(to bottom, #38bdf8, #bae6fd); }
    
    .env-rock .battle-pad { background: radial-gradient(circle, #78716c 30%, #292524 80%); border: 5px solid #a8a29e; }
    .env-rock .bg-layer { background: linear-gradient(to bottom, #44403c, #78716c); }
    
    .env-water .battle-pad { background: radial-gradient(circle, #0284c7 30%, #082f49 80%); border: 5px solid #38bdf8; box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 30px rgba(56, 189, 248, 0.5); }
    .env-water .bg-layer { background: linear-gradient(to bottom, #0c4a6e, #0284c7); }
    
    .env-electric .battle-pad { background: radial-gradient(circle, #ca8a04 30%, #422006 80%); border: 5px solid #fde047; }
    .env-electric .bg-layer { background: linear-gradient(to bottom, #1e293b, #451a03); }
    
    .env-fire .battle-pad { background: radial-gradient(circle, #dc2626 30%, #450a0a 80%); border: 5px solid #fca5a5; box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 40px rgba(239, 68, 68, 0.6); }
    .env-fire .bg-layer { background: linear-gradient(to bottom, #450a0a, #991b1b); }
    
    .env-psychic .battle-pad { background: radial-gradient(circle, #9333ea 30%, #3b0764 80%); border: 5px solid #d8b4fe; }
    .env-psychic .bg-layer { background: linear-gradient(to bottom, #2e1065, #7e22ce); }
    
    .env-poison .battle-pad { background: radial-gradient(circle, #a21caf 30%, #4a044e 80%); border: 5px solid #f0abfc; }
    .env-poison .bg-layer { background: linear-gradient(to bottom, #1e1b4b, #4a044e); }
    
    .env-dragon .battle-pad { background: radial-gradient(circle, #4338ca 30%, #1e1b4b 80%); border: 5px solid #818cf8; }
    .env-dragon .bg-layer { background: linear-gradient(to bottom, #0f172a, #312e81); }

    .sprite-container {
      position: absolute;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: opacity 0.3s ease;
    }
    
    .sprite-player { bottom: 18%; left: 10%; width: 200px; height: 200px; z-index: 20; }
    .sprite-enemy { top: 15%; right: 12%; width: 160px; height: 160px; z-index: 15; }

    .mon-sprite {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5));
      transition: filter 0.3s ease;
    }

    @keyframes lunge-p1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, -20px) scale(1.1) rotate(5deg); }
    }
    .anim-lunge-p1 { animation: lunge-p1 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    @keyframes lunge-p2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-60px, 20px) scale(1.1) rotate(-5deg); }
    }
    .anim-lunge-p2 { animation: lunge-p2 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    @keyframes faint-drop {
      0% { transform: translateY(0); opacity: 1; filter: grayscale(0); }
      100% { transform: translateY(50px); opacity: 0; filter: grayscale(1); }
    }
    .anim-faint { animation: faint-drop 1s ease-in forwards; }

    @keyframes shake-soft {
      0%, 100% { transform: translate(0,0); }
      25% { transform: translate(3px, 3px) rotate(1deg); }
      75% { transform: translate(-3px, -3px) rotate(-1deg); }
    }
    .shake-soft { animation: shake-soft 0.2s linear infinite; }

    @keyframes shake-violent {
      0%, 100% { transform: translate(0,0) scale(1); filter: brightness(1); }
      25% { transform: translate(25px, -25px) scale(1.05); filter: brightness(1.5); }
      50% { transform: translate(-25px, 25px) scale(0.95); }
      75% { transform: translate(20px, 10px) scale(1.03); }
    }
    .shake-violent { animation: shake-violent 0.15s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite; }

    .flash-damage { animation: flash-red 0.4s ease-out forwards; }
    @keyframes flash-red {
      0%, 100% { filter: brightness(1) sepia(0); }
      50% { filter: brightness(3) sepia(1) hue-rotate(-50deg) saturate(5); }
    }

    .vfx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    .vfx-orb {
      position: absolute;
      width: 40px; height: 40px;
      background: radial-gradient(circle, #fff, var(--vfx-color));
      border-radius: 50%;
      box-shadow: 0 0 20px var(--vfx-color), 0 0 40px var(--vfx-color);
      transform: translate(-50%, -50%);
    }

    .vfx-slash {
      position: absolute;
      width: 0px; height: 12px;
      background: white;
      box-shadow: 0 0 20px white, 0 0 40px var(--vfx-color);
      transform: translate(-50%, -50%) rotate(var(--rot));
      border-radius: 6px;
      animation: slash-anim 0.3s ease-out forwards;
    }
    @keyframes slash-anim {
      50% { width: 150px; opacity: 1; }
      100% { width: 150px; opacity: 0; }
    }

    .vfx-beam {
      position: absolute;
      height: 60px;
      background: linear-gradient(90deg, transparent, white 20%, var(--vfx-color) 50%, transparent);
      box-shadow: 0 0 30px var(--vfx-color);
      border-radius: 30px;
      transform-origin: left center;
      animation: beam-anim 0.5s ease-out forwards;
    }
    @keyframes beam-anim {
      0% { width: 0; opacity: 1; }
      50% { width: 100%; opacity: 1; height: 80px; }
      100% { width: 100%; opacity: 0; height: 0px; }
    }

    .vfx-impact {
      position: absolute;
      width: 150px; height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, white 10%, var(--vfx-color) 40%, transparent 80%);
      transform: translate(-50%, -50%) scale(0);
      mix-blend-mode: screen;
      animation: impact-anim 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }
    @keyframes impact-anim {
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    .vfx-pokeball {
      position: absolute;
      width: 32px; height: 32px;
      background: linear-gradient(to bottom, #ef4444 50%, white 50%);
      border: 3px solid #1e293b;
      border-radius: 50%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset -5px -5px 10px rgba(0,0,0,0.2);
    }
    .vfx-pokeball::before {
      content: ''; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 10px; height: 10px; background: white; border: 2px solid #1e293b; border-radius: 50%;
    }

    @keyframes throw-arc {
      0% { left: 20%; bottom: 20%; transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(360deg) translateY(-100px); }
      100% { left: 75%; bottom: 55%; transform: scale(0.8) rotate(720deg); opacity: 1; }
    }
    .anim-throw-ball { animation: throw-arc 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }

    @keyframes ball-wiggle {
      0%, 100% { transform: rotate(0deg) scale(0.8); }
      25% { transform: rotate(-25deg) scale(0.8); }
      75% { transform: rotate(25deg) scale(0.8); }
    }
    .anim-ball-wiggle { animation: ball-wiggle 0.5s ease-in-out; }
    
    @keyframes absorb-mon {
      0% { transform: scale(1); opacity: 1; filter: brightness(1); }
      100% { transform: scale(0.05); opacity: 0; filter: brightness(10) sepia(1) hue-rotate(-50deg); }
    }
    .anim-absorb { animation: absorb-mon 0.6s ease-in forwards; }
  </style>
</head>

    function createCombatant(name, lvl, isBoss = false) {
      const base = POKEDEX[name] || POKEDEX.Pikachu;
      const mult = isBoss ? 1.3 : 1.0;
      const hp = Math.floor(((base.hp * 2 * lvl) / 100 + lvl + 10) * mult);
      return {
        id: crypto.randomUUID(),
        dexId: base.id,
        name: isBoss ? `BOSS ${name}` : name,
        baseName: name,
        type: base.type,
        lvl, hp, maxHp: hp,
        stats: {
          atk: Math.floor(((base.atk * 2 * lvl) / 100 + 5) * mult),
          def: Math.floor(((base.def * 2 * lvl) / 100 + 5) * mult),
          spAtk: Math.floor(((base.spAtk * 2 * lvl) / 100 + 5) * mult),
          spDef: Math.floor(((base.spDef * 2 * lvl) / 100 + 5) * mult),
          spd: Math.floor(((base.spd * 2 * lvl) / 100 + 5) * mult)
        },
        moves: [...base.moves]
      };
    }

    function calcDamage(attacker, defender, move) {
      if(move.power === 0) return { damage: 0, mult: 1, crit: false };
      const isCrit = Math.random() < 0.0625;
      const aStat = move.category === 'Physical' ? attacker.stats.atk : attacker.stats.spAtk;
      const dStat = move.category === 'Physical' ? defender.stats.def : defender.stats.spDef;
      
      let baseDmg = Math.floor(Math.floor(Math.floor(2 * attacker.lvl / 5 + 2) * move.power * (aStat / dStat)) / 50) + 2;
      
      const stab = attacker.type.includes(move.type) ? 1.5 : 1;
      let typeMult = 1;
      defender.type.forEach(t => {
        if(TYPE_CHART[move.type] && TYPE_CHART[move.type][t] !== undefined) typeMult *= TYPE_CHART[move.type][t];
      });

      const random = (Math.floor(Math.random() * 16) + 85) / 100;
      const finalDmg = Math.floor(baseDmg * stab * typeMult * (isCrit ? 1.5 : 1) * random);
      
      return { damage: Math.max(1, finalDmg), mult: typeMult, crit: isCrit };
    }

    const audioCtx = { synth: null, noise: null, active: false };
    function initAudio() {
      if(!audioCtx.synth) {
        audioCtx.synth = new Tone.PolySynth(Tone.Synth).toDestination();
        audioCtx.noise = new Tone.NoiseSynth().toDestination();
        audioCtx.synth.volume.value = -8;
        audioCtx.noise.volume.value = -12;
      }
      Tone.start();
      audioCtx.active = true;
    }
    
    function playSfx(type) {
      if(!audioCtx.active || !audioCtx.synth) return;
      const now = Tone.now();
      switch(type) {
        case 'hit': audioCtx.noise.triggerAttackRelease('16n', now); break;
        case 'super': audioCtx.synth.triggerAttackRelease(['C5','E5','G5'], '8n', now); break;
        case 'faint': audioCtx.synth.triggerAttackRelease(['C3','G2','C2'], '4n', now); break;
        case 'catch': audioCtx.synth.triggerAttackRelease(['C4','E4','G4','C5'], '4n', now); break;
        case 'evo': audioCtx.synth.triggerAttackRelease(['G4','B4','D5','G5'], '2n', now); break;
        case 'ui': audioCtx.synth.triggerAttackRelease('C6', '32n', now); break;
      }
    }

    const BattleScreen = ({ player, gymId, setScreen, saveGame }) => {

      const addVfx = (vfx) => {
        setVfxList(prev => [...prev, vfx]);
        setTimeout(() => {
          setVfxList(prev => prev.filter(v => v.id !== vfx.id));

      };

      // Turn Execution Logic
      const executeMove = async (moveName) => {

        setLogMsg(`${p1.name} used ${move.name}!`);
        setCamState('cam-p1-atk');

        const p1Sprite = document.getElementById('sprite-p1');

        // Sync Global Team State

        p1Sprite.classList.remove('flash-damage');

        await new Promise(r => setTimeout(r, 1500));
        
        // If we switched because of a faint, it's our turn now. If manual switch, enemy gets a free hit.
        if(p1.hp > 0) {

        } else {

                  </div>
                  <div className="w-full h-2.5 bg-black/80 rounded-full overflow-hidden p-0.5 border border-white/10">
                    <div className={`h-full rounded-full transition-all duration-500 ${p2.hp/p2.maxHp > 0.5 ? 'bg-emerald-400' : p2.hp/p2.maxHp > 0.2 ? 'bg-amber-400' : 'bg-red-500'}`} style={{width: `${(p2.hp/p2.maxHp)*100}%`}}></div>
                  </div>
               </div>

               {/* Player HUD */}
               <div className="glass-panel p-3 rounded-2xl w-48 md:w-64 border-indigo-500/30 mt-24 md:mt-32">
                  <div className="flex justify-between items-center text-[9px] mb-1">
                    <span className="font-bold text-indigo-400 truncate">{p1.name}</span>
                    <span className="text-gray-400 font-mono">Lv.{p1.lvl}</span>
                  </div>
                  <div className="w-full h-2.5 bg-black/80 rounded-full overflow-hidden p-0.5 border border-white/10">
                    <div className={`h-full rounded-full transition-all duration-500 ${p1.hp/p1.maxHp > 0.5 ? 'bg-emerald-400' : p1.hp/p1.maxHp > 0.2 ? 'bg-amber-400' : 'bg-red-500'}`} style={{width: `${(p1.hp/p1.maxHp)*100}%`}}></div>
                  </div>
                  <div className="text-[8px] text-right font-mono mt-1 text-slate-300">{p1.hp} / {p1.maxHp}</div>
               </div>
            </div>
          </main>

          {/* ACTION FOOTER */}
          <footer className="h-48 bg-[#05060d]/95 border-t border-white/10 p-3 flex flex-col max-w-2xl mx-auto w-full z-40">
            <div className="text-[10px] leading-relaxed text-indigo-200 h-10 flex items-center px-4 rounded-xl bg-white/5 font-mono border border-white/5 mb-2">
              {logMsg}
            </div>

            {menuState === 'main' && (
              <div className="grid grid-cols-2 gap-2 flex-1">
                <button onClick={() => { playSfx('ui'); setMenuState('fight'); }} className="bg-red-600 hover:bg-red-500 rounded-xl border-b-4 border-red-800 font-bold text-sm active:translate-y-1 active:border-b-0 flex items-center justify-center gap-2">⚔️ FIGHT</button>
                <button onClick={() => { playSfx('ui'); setMenuState('switch'); }} className="bg-green-600 hover:bg-green-500 rounded-xl border-b-4 border-green-800 font-bold text-sm active:translate-y-1 active:border-b-0 flex items-center justify-center gap-2">🔄 POKÉMON</button>
              </div>
            )}

            {menuState === 'fight' && (
              <div className="flex flex-col h-full gap-2">
                <div className="grid grid-cols-2 gap-2 flex-1">
                  {p1.moves.map(mName => {
                    const m = MOVES[mName];
                    if(!m) return null;
                    const estDmg = getEstimatedDmg(mName);
                    return (
                      <button key={mName} onClick={() => executeMove(mName)} className="glass-panel p-2 rounded-xl text-left active:scale-95 transition-transform flex flex-col justify-between" style={{borderColor: `${m.color}80`}}>
                        <div className="flex justify-between w-full">
                          <span className="text-[10px] font-bold text-white">{m.name}</span>
                          <span className="text-[8px] font-bold" style={{color: m.color}}>{m.type}</span>
                        </div>
                        <div className="flex justify-between w-full mt-1 opacity-80">
                          <span className="text-[8px] font-mono">PWR {m.power||'--'}</span>
                          {m.power > 0 && <span className="text-[8px] text-yellow-300 font-mono">Dmg: {estDmg[0]}-{estDmg[1]}</span>}
                        </div>
                      </button>
                    )
                  })}
                </div>
                <button onClick={() => setMenuState('main')} className="bg-slate-800 p-2 rounded-lg text-[9px] font-bold text-slate-300">BACK</button>
              </div>
            )}

            {menuState === 'switch' && (
              <div className="flex flex-col h-full gap-2">
                <div className="flex overflow-x-auto gap-2 flex-1 pb-1">
                  {player.team.map((mon, idx) => (
                    <button key={mon.id} disabled={mon.hp <= 0 || idx === activeP1} onClick={() => switchMon(idx)} className={`min-w-[120px] p-2 rounded-xl border-2 flex flex-col items-center ${mon.hp <= 0 ? 'bg-red-950/50 border-red-900 opacity-50 grayscale' : idx === activeP1 ? 'bg-slate-700 border-yellow-500' : 'bg-slate-800 border-slate-600 active:scale-95'}`}>
                      <img src={`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${mon.dexId}.png`} className="w-10 h-10 pixel-art" />
                      <span className="text-[9px] font-bold mt-1 truncate w-full text-center">{mon.name}</span>
                      <span className="text-[8px] font-mono text-slate-400">{mon.hp}/{mon.maxHp}</span>
                    </button>
                  ))}
                </div>
                {!locked && <button onClick={() => setMenuState('main')} className="bg-slate-800 p-2 rounded-lg text-[9px] font-bold text-slate-300 mt-1">BACK</button>}
              </div>
            )}
          </footer>
        </div>
      );
    };

    // Initialize React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
