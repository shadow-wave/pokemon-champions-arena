<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pokémon Ultra FX | Champions Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
      :root {
        --vfx-color: #60a5fa;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }

      * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

      body {
        font-family: 'Press Start 2P', monospace;
        background-color: #050505;
        color: #f8fafc;
        height: 100dvh;
        width: 100vw;
        overflow: hidden;
        touch-action: none;
      }

      .pixel-art { 
        image-rendering: -webkit-optimize-contrast;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
        image-rendering: pixelated; 
      }

      @keyframes sprite-idle {
        0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6)); }
        50% { transform: scale(1.02) translateY(-4px); filter: drop-shadow(0 25px 25px rgba(0,0,0,0.4)); }
      }
      .anim-sprite-idle { animation: sprite-idle 2.5s ease-in-out infinite; }

      /* --- CINEMATICS --- */
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .anim-fade-in { animation: fade-in 0.8s ease-out forwards; }
      
      @keyframes slide-in-left { from { transform: translateX(-100vw); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      .anim-slide-left { animation: slide-in-left 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      
      @keyframes slide-in-right { from { transform: translateX(100vw); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      .anim-slide-right { animation: slide-in-right 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

      @keyframes vs-crash {
        0% { transform: scale(3); opacity: 0; }
        50% { transform: scale(1); opacity: 1; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      .anim-vs { animation: vs-crash 0.5s cubic-bezier(0.1, 0.7, 1.0, 0.1) forwards; }

      /* --- EVOLUTION --- */
      @keyframes evo-flash {
        0% { filter: brightness(0) invert(1); transform: scale(1); }
        50% { filter: brightness(1) invert(0); transform: scale(1.1); }
        100% { filter: brightness(0) invert(1); transform: scale(1); }
      }
      .anim-evo-flash { animation: evo-flash 0.4s linear infinite; }
      
      @keyframes evo-glow {
        0% { box-shadow: 0 0 10px white; }
        50% { box-shadow: 0 0 50px white, 0 0 100px white; }
        100% { box-shadow: 0 0 10px white; }
      }
      .anim-evo-glow { animation: evo-glow 1.5s ease-in-out infinite; }

      /* --- STADIUM ENVIRONMENTS --- */
      .stadium-lights {
        background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.4) 0%, transparent 60%);
        mix-blend-mode: overlay;
      }
      .stadium-crowd {
        background-image: radial-gradient(circle, #334155 1px, transparent 1px);
        background-size: 4px 4px;
        opacity: 0.3;
        mask-image: linear-gradient(to bottom, transparent, black);
      }
      .battle-platform {
        background: radial-gradient(circle, #10b981 30%, #047857 70%);
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
        border: 4px solid rgba(255,255,255,0.1);
      }
      .stadium-floor { background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.2) 10px, rgba(0,0,0,0.2) 20px); }
      .pool-water { background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2) 10%, transparent 20%); background-size: 20px 20px; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); }
      .grid-floor { background-image: linear-gradient(transparent 90%, rgba(255,255,0,0.2) 90%), linear-gradient(90deg, transparent 90%, rgba(255,255,0,0.2) 90%); background-size: 30px 30px; }
      .toxic-floor { background-image: radial-gradient(circle, rgba(168,85,247,0.2) 20%, transparent 60%); background-size: 40px 40px; box-shadow: inset 0 0 50px rgba(0,0,0,0.6); }
      .magic-floor { background-image: radial-gradient(circle, rgba(236,72,153,0.15) 30%, transparent 70%); background-size: 60px 60px; box-shadow: inset 0 0 30px rgba(0,0,0,0.6); }
      .magma-floor { background-image: radial-gradient(ellipse at 50% 50%, rgba(239,68,68,0.3) 20%, transparent 50%); background-size: 50px 30px; }
      .desert-floor { background-image: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0,0,0,0.1) 20px, rgba(0,0,0,0.1) 40px); }

      /* --- VFX CHARGES & PROJECTILES --- */
      @keyframes charge-gather {
        0% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        50% { opacity: 1; border-width: 4px; filter: brightness(1.5) drop-shadow(0 0 15px var(--vfx-color)); }
        100% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 8px; background: white; }
      }
      .vfx-charge {
        position: absolute; width: 120px; height: 120px; border-radius: 50%;
        border: 2px solid var(--vfx-color); box-shadow: 0 0 20px var(--vfx-color);
        animation: charge-gather 0.5s ease-in forwards; z-index: 60; left: 50%; top: 50%;
      }

      @keyframes proj-p2e {
        0% { left: 25%; top: 65%; transform: scale(0.6); opacity: 1; }
        100% { left: 75%; top: 30%; transform: scale(1.3); opacity: 1; }
      }
      .anim-proj-p2e { animation: proj-p2e 0.35s linear forwards; }

      @keyframes proj-e2p {
        0% { left: 75%; top: 30%; transform: scale(0.6); opacity: 1; }
        100% { left: 25%; top: 65%; transform: scale(1.3); opacity: 1; }
      }
      .anim-proj-e2p { animation: proj-e2p 0.35s linear forwards; }

      @keyframes shockwave-grow {
        0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 25px; }
        100% { transform: translate(-50%, -50%) scale(6.0); opacity: 0; border-width: 0px; }
      }
      .vfx-shockwave {
        position: absolute; width: 100px; height: 100px; border-radius: 50%;
        border: 2px solid white; background: radial-gradient(circle, var(--vfx-color) 0%, rgba(255,255,255,0.8) 40%, transparent 80%);
        animation: shockwave-grow 0.35s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        z-index: 80; mix-blend-mode: screen;
      }

      @keyframes slash-cut {
        0% { width: 0; opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot, -35deg)) scaleX(1); }
        50% { width: 140%; opacity: 1; }
        100% { width: 140%; opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot, -35deg)) scaleX(0); }
      }
      .vfx-slash {
        position: absolute; height: 8px; background: white;
        box-shadow: 0 0 15px white, 0 0 30px var(--vfx-color);
        z-index: 75; animation: slash-cut 0.3s ease-out forwards; border-radius: 4px;
      }

      @keyframes strike-down {
        0% { height: 0; opacity: 1; }
        25% { height: 160%; opacity: 1; width: 140px; transform: translateX(-10px); box-shadow: 0 0 80px var(--vfx-color); }
        100% { opacity: 0; width: 0; }
      }
      .vfx-strike {
        position: absolute; width: 80px; top: -50px;
        background: linear-gradient(180deg, #fff 0%, var(--vfx-color) 80%, #fff 100%);
        box-shadow: 0 0 40px var(--vfx-color), inset 0 0 10px white;
        z-index: 70; animation: strike-down 0.4s ease-out forwards;
        mix-blend-mode: screen;
      }

      /* PARTICLES */
      @keyframes spark-fly {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
      }
      .particle-spark {
        position: absolute; width: 8px; height: 8px; background: var(--vfx-color);
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        animation: spark-fly 0.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        box-shadow: 0 0 10px var(--vfx-color); z-index: 82;
      }

      /* CAMERA SHAKES & FLICKERS */
      @keyframes shake-hard {
        0%, 100% { transform: translate(0,0); }
        25% { transform: translate(15px, 15px) rotate(2deg); }
        75% { transform: translate(-15px, -10px) rotate(-2deg); }
      }
      .shake-hard { animation: shake-hard 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite; }

      @keyframes shake-violent {
        0%, 100% { transform: translate(0,0) scale(1); }
        25% { transform: translate(25px, -25px) scale(1.05); }
        50% { transform: translate(-25px, 25px) scale(0.95); }
        75% { transform: translate(20px, 10px) scale(1.02); }
      }
      .shake-violent { animation: shake-violent 0.12s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite; }

      @keyframes flash-white { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(8) contrast(200%); } }
      .filter-flash { animation: flash-white 0.25s ease-in-out; }

      /* CATCH CINEMATICS */
      @keyframes throw-curve {
        0% { left: 20%; bottom: 25%; transform: scale(0.6) rotate(0deg); opacity: 1; }
        50% { transform: scale(1.2) rotate(360deg) translateY(-140px); }
        100% { left: 75%; bottom: 65%; transform: scale(0.65) rotate(720deg); opacity: 1; }
      }
      .anim-throw { animation: throw-curve 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

      @keyframes ball-wiggle {
        0%, 100% { transform: rotate(0deg) scale(0.65); }
        25% { transform: rotate(-25deg) scale(0.65); }
        75% { transform: rotate(25deg) scale(0.65); }
      }
      .anim-wiggle { animation: ball-wiggle 0.45s ease-in-out; }

      @keyframes absorb-mon {
        0% { transform: scale(1); filter: brightness(1); opacity: 1; }
        100% { transform: scale(0.05); filter: brightness(20) sepia(1) hue-rotate(-50deg); opacity: 0; }
      }
      .anim-absorb { animation: absorb-mon 0.6s ease-in forwards; }

      /* WEATHER OVERLAYS */
      @keyframes rain-fall {
        0% { background-position: 0 0; }
        100% { background-position: -40px 100vh; }
      }
      .anim-rain {
        background-image: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4) 60%, transparent 100%);
        background-size: 2px 45px; animation: rain-fall 0.5s linear infinite; transform: rotate(12deg) scale(1.4);
      }

      @keyframes sandstorm-blow {
        0% { background-position: 0 0; }
        100% { background-position: 100vw 0; }
      }
      .anim-sandstorm {
        background-image: radial-gradient(ellipse, rgba(210,180,140,0.4) 10%, transparent 50%);
        background-size: 100px 25px; animation: sandstorm-blow 0.8s linear infinite;
      }

      .glass-panel {
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body class="flex flex-col relative">

    <!-- TOP ARENA BAR -->
    <header class="h-14 pt-[var(--sat)] px-4 flex items-center justify-between shrink-0 z-40 bg-[#070913]/95 border-b border-white/5">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-xs">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
          <h1 class="text-[11px] text-white leading-tight">POKÉMON <span class="text-indigo-400">ULTRA FX</span></h1>
          <span id="arena-banner" class="text-[8px] text-gray-400 font-sans">Champions Arena</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleAudio()" id="audio-btn" class="px-2.5 py-1 rounded-lg glass-panel text-[8px] text-gray-300 flex items-center gap-1.5 active:scale-95 transition">
          <i class="fa-solid fa-volume-xmark text-rose-400" id="audio-icon"></i>
          <span id="audio-text">Audio: OFF</span>
        </button>
        <button onclick="openModal('gym-modal')" class="px-2.5 py-1 rounded-lg bg-indigo-600 active:bg-indigo-500 text-[8px] text-white font-bold transition">
          <i class="fa-solid fa-trophy mr-1"></i> Gyms
        </button>
        <button onclick="openModal('bag-modal')" class="px-2.5 py-1 rounded-lg glass-panel text-[8px] text-amber-300 font-bold transition">
          <i class="fa-solid fa-bag-shopping mr-1"></i> Bag
        </button>
        <button onclick="openModal('party-modal')" class="px-2.5 py-1 rounded-lg glass-panel text-[8px] text-purple-300 font-bold transition">
          <i class="fa-solid fa-users mr-1"></i> Team
        </button>
      </div>
    </header>

    <!-- 3D BATTLE STADIUM ARENA -->
    <main id="battle-scene" class="flex-1 relative overflow-hidden flex flex-col justify-between p-4 pb-2">
      
      <!-- Weather & Ambient Lighting -->
      <div id="weather-layer" class="absolute inset-0 pointer-events-none z-10"></div>
      <div class="absolute inset-0 stadium-lights pointer-events-none"></div>
      <div class="absolute inset-0 stadium-crowd pointer-events-none"></div>
      <div id="vfx-layer" class="absolute inset-0 pointer-events-none z-30"></div>

      <!-- ENEMY HUD & SPRITE[cite: 4, 6] -->
      <div class="w-full flex justify-between items-start max-w-xl mx-auto z-20 px-2">
        <div class="glass-panel p-3 rounded-2xl w-56 border-rose-500/20 shadow-2xl">
          <div class="flex justify-between items-center text-[9px] mb-1">
            <span id="enemy-name" class="font-bold text-rose-400">CHARIZARD</span>
            <span id="enemy-lvl" class="text-gray-400 font-mono">Lv.85</span>
          </div>
          <div class="w-full h-2.5 bg-black/60 rounded-full overflow-hidden p-0.5 border border-white/10">
            <div id="enemy-hp-bar" class="h-full bg-emerald-400 rounded-full w-full transition-all duration-500"></div>
          </div>
          <div class="flex justify-between items-center text-[8px] mt-1 text-gray-400 font-mono">
            <div id="enemy-type-badges" class="flex gap-1"></div>
            <span id="enemy-hp-text">100%</span>
          </div>
        </div>

        <div class="relative w-36 h-36 flex items-center justify-center">
          <div class="absolute bottom-2 w-28 h-8 rounded-full bg-black/60 blur-md -z-10"></div>
          <img id="enemy-sprite" class="pokemon-sprite pixel-art anim-sprite-idle w-32 h-32 object-contain" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/6.gif" alt="Enemy">
        </div>
      </div>

      <!-- 3D BATTLE PLATFORM[cite: 6] -->
      <div id="battle-platform" class="absolute inset-x-8 top-1/3 bottom-20 battle-platform rounded-[40px] -z-10 flex items-center justify-center">
        <div class="w-24 h-24 rounded-full border-2 border-white/20 flex items-center justify-center">
          <div class="w-8 h-8 rounded-full bg-white/10"></div>
        </div>
      </div>

      <!-- PLAYER HUD & SPRITE[cite: 4, 6] -->
      <div class="w-full flex justify-between items-end max-w-xl mx-auto z-20 px-2">
        <div class="relative w-36 h-36 flex items-center justify-center">
          <div class="absolute bottom-2 w-28 h-8 rounded-full bg-black/60 blur-md -z-10"></div>
          <img id="player-sprite" class="pokemon-sprite pixel-art anim-sprite-idle w-32 h-32 object-contain" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/back/9.gif" alt="Player">
        </div>

        <div class="glass-panel p-3 rounded-2xl w-56 border-indigo-500/30 shadow-2xl mb-2">
          <div class="flex justify-between items-center text-[9px] mb-1">
            <span id="player-name" class="font-bold text-indigo-400">BLASTOISE</span>
            <span id="player-lvl" class="text-gray-400 font-mono">Lv.85</span>
          </div>
          <div class="w-full h-2.5 bg-black/60 rounded-full overflow-hidden p-0.5 border border-white/10">
            <div id="player-hp-bar" class="h-full bg-emerald-400 rounded-full w-full transition-all duration-500"></div>
          </div>
          <div class="flex justify-between items-center text-[8px] mt-1 text-gray-400 font-mono">
            <div id="player-type-badges" class="flex gap-1"></div>
            <span id="player-hp-text">280 / 280</span>
          </div>
        </div>
      </div>
    </main>

    <!-- ACTION CONTROL FOOTER[cite: 4] -->
    <footer class="h-44 bg-[#05060d]/95 border-t border-white/10 p-3 flex flex-col justify-between max-w-2xl mx-auto w-full z-40">
      <div id="battle-log" class="text-[9px] leading-relaxed text-indigo-200 h-8 flex items-center px-3 rounded-xl bg-white/5 font-mono border border-white/5 overflow-hidden">
        What will you do?
      </div>

      <div id="moves-grid" class="grid grid-cols-2 gap-2 mt-2"></div>
    </footer>

    <!-- MODAL: GYM LEAGUES[cite: 4] -->
    <div id="gym-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
      <div class="glass-panel w-full max-w-md p-5 rounded-3xl space-y-3 max-h-[85vh] flex flex-col">
        <div class="flex items-center justify-between border-b border-white/10 pb-2">
          <span class="text-xs text-indigo-400 font-bold">GYM STADIUMS</span>
          <button onclick="closeModal('gym-modal')" class="text-gray-400 hover:text-white text-xs">✕</button>
        </div>
        <div id="gym-list" class="space-y-2 overflow-y-auto pr-1 flex-1 no-scrollbar"></div>
      </div>
    </div>

    <!-- MODAL: BAG & POKEBALLS[cite: 4] -->
    <div id="bag-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
      <div class="glass-panel w-full max-w-md p-5 rounded-3xl space-y-3 max-h-[85vh] flex flex-col">
        <div class="flex items-center justify-between border-b border-white/10 pb-2">
          <span class="text-xs text-amber-400 font-bold">TRAINER BAG</span>
          <button onclick="closeModal('bag-modal')" class="text-gray-400 hover:text-white text-xs">✕</button>
        </div>
        <div id="bag-list" class="grid grid-cols-2 gap-2 overflow-y-auto pr-1 flex-1 no-scrollbar"></div>
      </div>
    </div>

    <!-- MODAL: PARTY ROSTER[cite: 4] -->
    <div id="party-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
      <div class="glass-panel w-full max-w-md p-5 rounded-3xl space-y-3 max-h-[85vh] flex flex-col">
        <div class="flex items-center justify-between border-b border-white/10 pb-2">
          <span class="text-xs text-purple-400 font-bold">YOUR TEAM</span>
          <button onclick="closeModal('party-modal')" class="text-gray-400 hover:text-white text-xs">✕</button>
        </div>
        <div id="party-list" class="space-y-2 overflow-y-auto pr-1 flex-1 no-scrollbar"></div>
      </div>
    </div>

    <!-- SCRIPT ENGINE WITH COMPLETE DATA[cite: 4] -->
    <script>
      // TYPE CHART[cite: 4]
      const qf = {
        Normal:{Rock:.5,Ghost:0,Steel:.5},
        Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},
        Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5},
        Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},
        Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5},
        Ice:{Fire:.5,Water:.5,Grass:2,Ice:.5,Ground:2,Flying:2,Dragon:2,Steel:.5},
        Fighting:{Normal:2,Ice:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Rock:2,Ghost:0,Dark:2,Steel:2,Fairy:.5},
        Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0},
        Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2},
        Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5},
        Psychic:{Fighting:2,Poison:2,Psychic:.5,Dark:0,Steel:.5},
        Bug:{Fire:.5,Grass:2,Fighting:.5,Poison:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5,Fairy:.5},
        Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5},
        Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5},
        Dragon:{Dragon:2,Steel:.5,Fairy:0},
        Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Steel:.5,Fairy:2},
        Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Fairy:.5},
        Fairy:{Fire:.5,Fighting:2,Poison:.5,Dragon:2,Dark:2,Steel:.5},
        God:{Normal:1,Fire:1,Water:1,Grass:1,Electric:1,Ice:1,Fighting:1,Poison:1,Ground:1,Flying:1,Psychic:1,Bug:1,Rock:1,Ghost:1,Dragon:1,Steel:1,Dark:1,Fairy:1}
      };

      // MOVES[cite: 4]
      const ci = {
        Tackle:{name:"Tackle",type:"Normal",category:"Physical",power:40,accuracy:1,pp:35,color:"#94a3b8"},
        Scratch:{name:"Scratch",type:"Normal",category:"Physical",power:40,accuracy:1,pp:35,color:"#94a3b8"},
        "Quick Attack":{name:"Quick Attack",type:"Normal",category:"Physical",power:40,accuracy:1,pp:30,color:"#94a3b8"},
        Slash:{name:"Slash",type:"Normal",category:"Physical",power:70,accuracy:1,pp:20,color:"#94a3b8"},
        "Vine Whip":{name:"Vine Whip",type:"Grass",category:"Physical",power:45,accuracy:1,pp:25,color:"#4ade80"},

      function createCombatant(name, lvl, isBoss = false) {
        const base = Gn[name] || Gn.Pikachu;
        const mult = isBoss ? 1.3 : 1.0;
        const hpCalc = Math.floor(((base.hp * 2 * lvl) / 100 + lvl + 10) * mult);
        return {
          ...base,
          lvl,
          maxHp: hpCalc,
          currentHp: hpCalc,
          stages: { atk:0, def:0, spAtk:0, spDef:0, spd:0 },
          status: null
        };
      }

      // TONE.JS AUDIO SYNTHESIS[cite: 4, 6]
      let audioActive = false;
      let synth, noise;

      function toggleAudio() {
        if (!synth) {
          synth = new Tone.PolySynth(Tone.Synth).toDestination();
          noise = new Tone.NoiseSynth().toDestination();
        }
        Tone.start();
        audioActive = !audioActive;
        document.getElementById('audio-text').innerText = audioActive ? "Audio: ON" : "Audio: OFF";
        document.getElementById('audio-icon').className = audioActive ? "fa-solid fa-volume-high text-emerald-400" : "fa-solid fa-volume-xmark text-rose-400";
        if (audioActive) synth.triggerAttackRelease(['C4', 'E4', 'G4'], '8n');
      }

      function playSfx(type) {
        if (!audioActive) return;
        try {
          if (type === 'hit') noise.triggerAttackRelease('16n');
          else if (type === 'super') synth.triggerAttackRelease(['G4', 'C5', 'E5'], '8n');
          else if (type === 'faint') synth.triggerAttackRelease(['G3', 'Eb3', 'C3'], '4n');
          else if (type === 'catch') synth.triggerAttackRelease(['C5', 'G4', 'C4'], '8n');
        } catch(e) {}
      }

      // BATTLE ENGINE[cite: 4]
      function initBattleView() {
        document.getElementById('player-name').innerText = battle.player.name;
        document.getElementById('player-lvl').innerText = `Lv.${battle.player.lvl}`;
        document.getElementById('player-sprite').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/back/${battle.player.id}.gif`;
        
        const pTypes = document.getElementById('player-type-badges');
        pTypes.innerHTML = "";
        battle.player.type.forEach(t => {
          pTypes.innerHTML += `<span class="px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[7.5px]">${t.toUpperCase()}</span>`;
        });

        const eTypes = document.getElementById('enemy-type-badges');

          eTypes.innerHTML += `<span class="px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 text-[7.5px]">${t.toUpperCase()}</span>`;
        });

        renderMoves();
        updateHpDisplay();
      }

      function renderMoves() {
        const grid = document.getElementById('moves-grid');
        grid.innerHTML = "";
        battle.player.moves.forEach(mName => {
          const m = ci[mName] || { name: mName, type: "Normal", power: 50, color: "#94a3b8" };
          const btn = document.createElement('button');
          btn.className = "p-2.5 rounded-xl glass-panel flex flex-col text-left hover:border-indigo-500/50 active:scale-95 transition";
          btn.onclick = () => executeTurn(m);
          btn.innerHTML = `
            <span class="text-[9px] font-bold text-white">${m.name}</span>
            <span class="text-[7.5px] font-mono mt-0.5" style="color:${m.color}">${m.type} • PWR ${m.power}</span>
          `;
          grid.appendChild(btn);
        });
      }

      function updateHpDisplay() {
        const pPct = Math.max(0, (battle.player.currentHp / battle.player.maxHp) * 100);
        const ePct = Math.max(0, (battle.enemy.currentHp / battle.enemy.maxHp) * 100);

        const pBar = document.getElementById('player-hp-bar');
        pBar.style.width = `${pPct}%`;
        pBar.className = `h-full rounded-full transition-all duration-500 ${pPct > 50 ? 'bg-emerald-400' : pPct > 20 ? 'bg-amber-400' : 'bg-rose-500'}`;
        document.getElementById('player-hp-text').innerText = `${Math.round(battle.player.currentHp)} / ${battle.player.maxHp}`;

        const eBar = document.getElementById('enemy-hp-bar');
        eBar.style.width = `${ePct}%`;
        eBar.className = `h-full rounded-full transition-all duration-500 ${ePct > 50 ? 'bg-emerald-400' : ePct > 20 ? 'bg-amber-400' : 'bg-rose-500'}`;
        document.getElementById('enemy-hp-text').innerText = `${Math.round(ePct)}%`;
      }

      // TURN RESOLUTION & VFX EXECUTION[cite: 4, 6]
      async function executeTurn(move) {
        if (battle.isTurnLocked || battle.player.currentHp <= 0 || battle.enemy.currentHp <= 0) return;
        battle.isTurnLocked = true;

        const scene = document.getElementById('battle-scene');
        const pSprite = document.getElementById('player-sprite');
        const eSprite = document.getElementById('enemy-sprite');
        const log = document.getElementById('battle-log');

        pSprite.classList.add('anim-lunge-player');
        log.innerText = `${battle.player.name} used ${move.name}!`;
        playSfx('hit');

        if (move.category === 'Physical') spawnSlash(move.color);
        else spawnShockwave(move.color);

        setTimeout(() => {
          pSprite.classList.remove('anim-lunge-player');

          // Multiplier calculation[cite: 4]
          let mult = 1.0;
          battle.enemy.type.forEach(t => {
            if (qf[move.type] && qf[move.type][t] !== undefined) mult *= qf[move.type][t];
          });

          const dmg = Math.round((move.power * 0.75 + Math.random() * 8) * mult);
          battle.enemy.currentHp = Math.max(0, battle.enemy.currentHp - dmg);
          updateHpDisplay();

          eSprite.classList.add('flash-fx');
          scene.classList.add('shake-hard');
          if (mult > 1.0) playSfx('super'); else playSfx('hit');

          setTimeout(() => {
            eSprite.classList.remove('flash-fx');
            scene.classList.remove('shake-hard');

            if (mult > 1.0) log.innerText = "It's super effective! 💥";
            else if (mult < 1.0 && mult > 0) log.innerText = "It's not very effective...";

            if (battle.enemy.currentHp <= 0) {
              log.innerText = `Enemy ${battle.enemy.name} fainted! You won! 🏆`;
              playSfx('faint');
              eSprite.style.opacity = '0';
              return;
            }

            setTimeout(enemyTurn, 900);
          }, 400);
        }, 350);
      }

      function enemyTurn() {
        const scene = document.getElementById('battle-scene');
        const pSprite = document.getElementById('player-sprite');
        const eSprite = document.getElementById('enemy-sprite');
        const log = document.getElementById('battle-log');

        const mName = battle.enemy.moves[Math.floor(Math.random() * battle.enemy.moves.length)];
        const move = ci[mName] || { name: mName, type: battle.enemy.type[0], power: 65, color: "#ef4444" };

        eSprite.classList.add('anim-lunge-enemy');
        log.innerText = `Enemy ${battle.enemy.name} used ${move.name}!`;
        playSfx('hit');

        setTimeout(() => {
          eSprite.classList.remove('anim-lunge-enemy');

          let mult = 1.0;
          battle.player.type.forEach(t => {
            if (qf[move.type] && qf[move.type][t] !== undefined) mult *= qf[move.type][t];
          });

          const dmg = Math.round((move.power * 0.7 + Math.random() * 8) * mult);
          battle.player.currentHp = Math.max(0, battle.player.currentHp - dmg);
          updateHpDisplay();

          pSprite.classList.add('flash-fx');
          scene.classList.add('shake-hard');

          setTimeout(() => {
            pSprite.classList.remove('flash-fx');
            scene.classList.remove('shake-hard');

            if (battle.player.currentHp <= 0) {
              log.innerText = `${battle.player.name} fainted! Choose another Pokémon!`;
              playSfx('faint');
              pSprite.style.opacity = '0';
              return;
            }

            battle.isTurnLocked = false;
            log.innerText = `What will ${battle.player.name} do?`;
          }, 400);
        }, 350);
      }

      // CATCHING MECHANICS[cite: 4, 6]
      function throwBall(typeKey) {
        const item = bag[typeKey];
        if (!item || item.count <= 0 || battle.isTurnLocked) return;
        item.count--;
        battle.isTurnLocked = true;
        closeModal('bag-modal');

        const log = document.getElementById('battle-log');
        log.innerText = `Threw a ${item.name}!`;

        const vfx = document.getElementById('vfx-layer');
        const ball = document.createElement('div');
        ball.className = 'absolute w-8 h-8 rounded-full bg-red-600 border-2 border-white shadow-xl anim-throw';
        vfx.appendChild(ball);

        setTimeout(() => {
          const eSprite = document.getElementById('enemy-sprite');
          eSprite.classList.add('anim-absorb');

          setTimeout(() => {
            ball.className = 'absolute w-8 h-8 rounded-full bg-red-600 border-2 border-white shadow-xl anim-wiggle';
            ball.style.left = '75%';
            ball.style.top = '35%';

            const hpRate = (battle.enemy.maxHp - battle.enemy.currentHp) / battle.enemy.maxHp;
            const success = (Math.random() + hpRate * 0.5) * item.rate > 0.8 || item.rate === 255;

            setTimeout(() => {
              ball.remove();
              if (success) {
                log.innerText = `Gotcha! ${battle.enemy.name} was caught! 🎉`;
                playSfx('catch');
                party.push({ ...battle.enemy });
              } else {
                log.innerText = `Oh no! The Pokémon broke free!`;
                eSprite.classList.remove('anim-absorb');
                eSprite.style.opacity = '1';
                setTimeout(enemyTurn, 900);
              }
            }, 1200);
          }, 600);
        }, 750);
      }

      // MODAL CONTROLS[cite: 4]
      function openModal(id) {
        if (id === 'gym-modal') renderGymList();
        if (id === 'bag-modal') renderBagList();
        if (id === 'party-modal') renderPartyList();
        document.getElementById(id).classList.remove('hidden');
        document.getElementById(id).classList.add('flex');
      }

      function closeModal(id) {
        document.getElementById(id).classList.add('hidden');
        document.getElementById(id).classList.remove('flex');
      }

      function renderGymList() {
        const list = document.getElementById('gym-list');
        list.innerHTML = "";
        ss.forEach((gym, idx) => {
          const btn = document.createElement('button');
          btn.className = "w-full p-3 rounded-2xl glass-panel flex items-center justify-between text-left hover:border-indigo-500 active:scale-95 transition";
          btn.onclick = () => selectGym(idx);
          btn.innerHTML = `
            <div>
              <span class="text-[10px] text-white font-bold block">${gym.name}</span>
              <span class="text-[8px] text-gray-400 font-sans">Leader ${gym.leader} • ${gym.team[0].name} (Lv.${gym.team[0].lvl})</span>
            </div>
            <i class="fa-solid fa-chevron-right text-indigo-400 text-xs"></i>
          `;
          list.appendChild(btn);
        });
      }

      function selectGym(idx) {
        const g = ss[idx];
        const bossMon = g.team[g.team.length - 1];
        battle.enemy = createCombatant(bossMon.name, bossMon.lvl, true);
        document.getElementById('arena-banner').innerText = `${g.name} Stadium`;
        document.getElementById('enemy-sprite').style.opacity = '1';

        const platform = document.getElementById('battle-platform');
        platform.className = `absolute inset-x-8 top-1/3 bottom-20 battle-platform rounded-[40px] -z-10 flex items-center justify-center ${g.floor}`;

        initBattleView();
        closeModal('gym-modal');
      }

      function renderBagList() {
        const list = document.getElementById('bag-list');
        list.innerHTML = "";
        Object.entries(bag).forEach(([key, item]) => {
          const btn = document.createElement('button');
          btn.className = "p-3 rounded-2xl glass-panel flex flex-col items-start hover:border-amber-500 active:scale-95 transition";
          btn.onclick = () => {
            if (key.includes('Ball')) throwBall(key);
            else if (key === 'potion') {
              battle.player.currentHp = battle.player.maxHp;
              updateHpDisplay();
              item.count--;
              closeModal('bag-modal');
              document.getElementById('battle-log').innerText = `Used ${item.name}! HP fully restored!`;
            }
          };
          btn.innerHTML = `
            <span class="text-[9px] font-bold text-white">${item.name}</span>
            <span class="text-[8px] text-amber-400 font-mono mt-1">QTY: ${item.count}</span>
          `;
          list.appendChild(btn);
        });
      }

      function renderPartyList() {
        const list = document.getElementById('party-list');
        list.innerHTML = "";
        party.forEach((p, idx) => {
          const btn = document.createElement('button');
          btn.className = `w-full p-2.5 rounded-2xl glass-panel flex items-center justify-between text-left hover:border-purple-500 active:scale-95 transition ${battle.player === p ? 'border-purple-500 bg-purple-950/20' : ''}`;
          btn.onclick = () => {
            battle.player = party[idx];
            document.getElementById('player-sprite').style.opacity = '1';
            initBattleView();
            closeModal('party-modal');
          };
          btn.innerHTML = `
            <div class="flex items-center gap-3">
              <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" class="w-10 h-10 pixel-art">
              <div>
                <span class="text-[9px] text-white font-bold block">${p.name} (Lv.${p.lvl})</span>
                <span class="text-[8px] text-gray-400 font-sans">HP: ${p.currentHp}/${p.maxHp}</span>
              </div>
            </div>
            <span class="text-[8px] font-mono text-purple-400 font-bold">${battle.player === p ? 'ACTIVE' : 'SWITCH'}</span>
          `;
          list.appendChild(btn);
        });
      }

      window.addEventListener('DOMContentLoaded', initBattleView);
    </script>
  </body>
</html>
